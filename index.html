<title>U-Points</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');
  :root{
    --bg:#FFFCF5; --card:#FFFFFF; --sky:#5AAEE0; --sky-dark:#2B6C93; --sky-light:#E4F4FC;
    --sun:#FFC94A; --sun-light:#FFEFC7; --text:#2E3A42; --muted:#7C8A92; --danger:#E08A5A; --border:#EFE6CF;
    --font-display:'Baloo 2','Nunito',sans-serif; --font-body:'Nunito','Baloo 2',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:linear-gradient(180deg,var(--sky-light) 0%, var(--bg) 340px);font-family:var(--font-body);color:var(--text);}
  #app{max-width:480px;margin:0 auto;padding:24px 18px 60px;position:relative;min-height:100vh;}
  .tap:active{transform:scale(0.94);}
  .tap{transition:transform .12s ease;}
  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}

  .avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(43,108,147,0.18);flex-shrink:0;}
  .avatar.ring{border:3px dashed rgba(255,255,255,0.85);}
  .avatar.rotate{transform:rotate(-6deg);}

  .btn-primary{background:var(--sky);color:#fff;border:none;border-radius:18px;padding:14px 22px;font-family:var(--font-display);font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 6px 14px rgba(90,174,224,.35);display:flex;align-items:center;justify-content:center;gap:6px;width:100%;}
  .btn-primary:disabled{background:#CBD5DA;box-shadow:none;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--sky-dark);border:2px solid var(--sky-light);border-radius:18px;padding:12px 20px;font-family:var(--font-display);font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;}
  .btn-danger{background:var(--danger);color:#fff;border:none;border-radius:18px;padding:14px 22px;font-family:var(--font-display);font-weight:700;font-size:15px;cursor:pointer;width:100%;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-family:var(--font-body);font-weight:700;font-size:14px;color:var(--text);margin-bottom:6px;}
  .field input{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--border);background:#FFFEFB;font-family:var(--font-body);font-size:15px;color:var(--text);outline:none;}

  .segmented{display:flex;background:var(--sky-light);border-radius:14px;padding:4px;margin-bottom:16px;}
  .segmented button{flex:1;border:none;border-radius:11px;padding:10px 8px;font-family:var(--font-body);font-weight:700;font-size:14px;cursor:pointer;background:transparent;color:var(--muted);}
  .segmented button.active{background:#fff;color:var(--sky-dark);box-shadow:0 2px 6px rgba(43,108,147,.15);}

  .avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px;}
  .avatar-pick{position:relative;background:none;border:none;padding:0;cursor:pointer;}
  .avatar-pick .sel-ring{position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--sky-dark);display:none;}
  .avatar-pick.selected .sel-ring{display:block;}

  .step-dots{display:flex;justify-content:center;gap:8px;margin-bottom:22px;}
  .step-dots span{height:8px;border-radius:6px;background:var(--border);transition:all .2s ease;display:inline-block;width:8px;}
  .step-dots span.active{width:22px;background:var(--sun);}

  .card-box{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;border:2px solid var(--border);}
  .dashed-btn{width:100%;border:2px dashed var(--sky);background:transparent;border-radius:18px;padding:14px;color:var(--sky-dark);font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:20px;}

  .modal-mask{position:fixed;inset:0;background:rgba(46,58,66,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-box{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 20px 28px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-title{font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--text);}
  .modal-close{background:var(--sky-light);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--sky-dark);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sky-dark);color:#fff;padding:10px 20px;border-radius:20px;font-family:var(--font-body);font-weight:700;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:60;}

  .child-card{background:var(--card);border:2px solid var(--border);border-radius:22px;padding:16px;text-align:left;cursor:pointer;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px;}
  .row3{display:flex;gap:10px;}
  .row3>div{flex:1;}

  .point-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-family:var(--font-display);font-weight:700;font-size:13px;}
  .point-pill.pos{background:var(--sky-light);color:var(--sky-dark);}
  .point-pill.neg{background:#FBE4D6;color:var(--danger);}
  .alert-banner{background:#FBE4D6;border:2px solid #F3C4A6;border-radius:18px;padding:14px 16px;margin-bottom:12px;}
  .alert-banner .t{font-family:var(--font-display);font-weight:700;font-size:14px;color:#B5502A;margin-bottom:4px;}
  .alert-banner .d{font-size:13px;color:#8A5230;margin-bottom:10px;line-height:1.5;}
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .chip{border:none;border-radius:14px;padding:9px 12px;font-family:var(--font-body);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .chip.reward{background:var(--sky-light);color:var(--sky-dark);}
  .chip.penalty{background:#FBE4D6;color:var(--danger);}
  .log-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);}
  .log-row .left{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);}
  .log-row .meta{font-size:11px;color:var(--muted);}
  .icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:16px;}
  .icon-pick{background:var(--sky-light);border:none;border-radius:10px;font-size:18px;padding:8px 0;cursor:pointer;}
  .icon-pick.selected{background:var(--sky);}
  .behavior-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .behavior-row .name{flex:1;font-size:14px;font-weight:700;color:var(--text);}
  .small-icon-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--muted);}
  .cat-tag{font-size:11px;color:var(--muted);background:var(--sky-light);border-radius:8px;padding:2px 7px;}

  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
  .settings-row .label{font-size:14px;font-weight:700;color:var(--text);}
  .settings-row .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .icon-btn-round{width:40px;height:40px;border-radius:50%;border:none;background:var(--sky-light);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:var(--sky-dark);}
  .sync-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;}
  .sync-dot.on{background:#5FAE7C;}
  .sync-dot.off{background:#C8C0AE;}
  .sync-dot.err{background:var(--danger);}
  .room-code-box{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:4px;text-align:center;background:var(--sky-light);border-radius:14px;padding:14px;color:var(--sky-dark);margin:10px 0;}
  .lang-toggle{display:flex;gap:6px;}
  .lang-toggle button{flex:1;border:2px solid var(--border);background:#fff;border-radius:12px;padding:8px;font-family:var(--font-display);font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);}
  .lang-toggle button.active{border-color:var(--sky);color:var(--sky-dark);background:var(--sky-light);}
  .role-card{border:2px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;cursor:pointer;text-align:center;}
  .role-card.active{border-color:var(--sky);background:var(--sky-light);}
</style>
</head>

/* ---------------- 基础存储 ---------------- */
var LS_PREFIX = 'sunnypoints:';
function storageGet(key, fallback){
  try{
    var raw = window.localStorage.getItem(LS_PREFIX + key);
    if(raw == null) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function storageSet(key, value){
  try{
    window.localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
    return true;
  }catch(e){
    console.error('storage set failed', key, e);
    toast(t('storageFullToast'));
    return false;
  }
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function nowIso(){ return new Date().toISOString(); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

  }
  return str;
}

function loadData(){
  var d = storageGet('data', null);
  if(d){
    if(!d.behaviors) d.behaviors = defaultBehaviors();
    if(!d.pointLogs) d.pointLogs = [];
    if(!d.thresholds) d.thresholds = [];
    return d;
  }
  return { family:null, parents:[], children:[], behaviors:[], pointLogs:[], thresholds:[], setupDone:false };
}

/* ---------------- 积分辅助 ---------------- */
function pointBalance(childId){
  return data.pointLogs.reduce(function(sum, log){ return log.childId === childId ? sum + log.points : sum; }, 0);
}
function behaviorById(id){
  for(var i=0;i<data.behaviors.length;i++) if(data.behaviors[i].id===id) return data.behaviors[i];
  return null;
}
function childThresholds(childId){
  return data.thresholds.filter(function(t2){ return t2.childId === childId; });
}
function rearmThresholds(childId){
  var bal = pointBalance(childId);
  data.thresholds.forEach(function(th){
    if(th.childId === childId && bal > th.value && th.dismissed){
      th.dismissed = false;
      th.updatedAt = nowIso();
      pushEntity('thresholds', th);
    }
  });
}
function activeAlerts(){
  var list = [];
  data.children.forEach(function(c){
    var bal = pointBalance(c.id);
    childThresholds(c.id).forEach(function(th){
      if(bal <= th.value && !th.dismissed) list.push({threshold:th, child:c, balance:bal});
    });
  });
  return list;
}

/* ---------------- 统一的"写入 + 保存 + 同步"封装 ----------------
   任何一条 parents/children/behaviors/pointLogs/thresholds 记录被增/改，
   都过这几个函数：本地立刻保存，若已连接云同步则顺带推送这一条。 */
function touch(entity){ entity.updatedAt = nowIso(); return entity; }

function upsertLocal(collectionName, entity){
  var arr = data[collectionName];
  var idx = arr.findIndex(function(x){ return x.id === entity.id; });
  if(idx>=0) arr[idx] = entity; else arr.push(entity);
}
function persistEntity(collectionName, entity){
  touch(entity);
  upsertLocal(collectionName, entity);
  saveData();
  if(cloudSyncActive()) pushEntity(collectionName, entity);
}
function persistDelete(collectionName, id){
  data[collectionName] = data[collectionName].filter(function(x){ return x.id!==id; });
  saveData();
  if(cloudSyncActive()) pushTombstone(collectionName, id);
}
function persistFamily(){
  data.family.updatedAt = nowIso();
  saveData();
  if(cloudSyncActive()) pushFamily();
}

function addPointLog(childId, behaviorId){
  var b = behaviorById(behaviorId);
  if(!b) return;
  var log = {
    id: uid(), childId: childId, behaviorId: behaviorId,
    name: b.name, name_en: b.name_en || '', icon: b.icon, points: b.points,
    date: todayStr(), time: (new Date()).toTimeString().slice(0,5)
  };
  persistEntity('pointLogs', log);
  rearmThresholds(childId);
}
function deletePointLog(logId){
  var log = data.pointLogs.find(function(l){ return l.id===logId; });
  persistDelete('pointLogs', logId);
  if(log) rearmThresholds(log.childId);
}

var FIREBASE_CONFIG = {

var FIREBASE_SDK_VERSION = '10.13.0';
var CLOUD = { app:null, auth:null, db:null, uid:null, sdkLoadPromise:null, unsubs:{}, pushMap: storageGet('cloudSyncPushMap', {}) };
var SYNC_COLLECTIONS = ['parents','children','behaviors','pointLogs','thresholds'];

function cloudSyncActive(){ return state.cloudSync.enabled && !!state.cloudSync.roomCode && CLOUD.db; }

function loadScriptOnce(src){
  return new Promise(function(resolve, reject){
    if(document.querySelector('script[src="'+src+'"]')){ resolve(); return; }
    var s = document.createElement('script');
    s.src = src;
    s.onload = function(){ resolve(); };
    s.onerror = function(){ reject(new Error('failed to load '+src)); };
    document.head.appendChild(s);
  });
}
function ensureFirebaseSdkLoaded(){
  if(CLOUD.sdkLoadPromise) return CLOUD.sdkLoadPromise;
  var base = 'https://www.gstatic.com/firebasejs/'+FIREBASE_SDK_VERSION+'/';
  CLOUD.sdkLoadPromise = loadScriptOnce(base+'firebase-app-compat.js')
    .then(function(){ return loadScriptOnce(base+'firebase-auth-compat.js'); })
    .then(function(){ return loadScriptOnce(base+'firebase-firestore-compat.js'); });
  return CLOUD.sdkLoadPromise;
}

var ROOM_CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 去掉容易看错的 0/O, 1/I
function genRoomCode(){
  var s = '';
  for(var i=0;i<8;i++) s += ROOM_CODE_CHARS[Math.floor(Math.random()*ROOM_CODE_CHARS.length)];
  return s;
}

function roomRef(){ return CLOUD.db.collection('syncRooms').doc(state.cloudSync.roomCode); }
function collRef(name){ return roomRef().collection(name); }
function familyDocRef(){ return roomRef().collection('meta').doc('family'); }

// 避免云同步引发的重渲染打断正在输入的文本框（iOS 上会导致键盘收起，需要重新点一次才能继续打字）
function safeRender(){
  var ae = document.activeElement;
  if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA')) return;
  render();
}

async function connectCloudSync(roomCode, isNewRoom){
  state.cloudSync.roomCode = roomCode;
  state.cloudSyncStatus = 'connecting';
  state.cloudSyncError = '';
  saveState();
  render();
  try{
    await ensureFirebaseSdkLoaded();
    CLOUD.app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
    CLOUD.auth = firebase.auth();
    CLOUD.db = firebase.firestore();
    var cred = await CLOUD.auth.signInAnonymously();
    CLOUD.uid = cred.user.uid;

    state.cloudSync.enabled = true;
    saveState();

    SYNC_COLLECTIONS.forEach(subscribeCollection);
    subscribeFamily();

    // 首次连接：把本机现有数据也推上去，避免创建/加入房间时丢失本机已有记录
    pushAllLocal();

    state.cloudSyncStatus = 'connected';
    toast(isNewRoom ? t('roomCreatedToast') : t('roomJoinedToast'));
  }catch(e){
    console.error('cloud sync connect failed', e);
    state.cloudSyncStatus = 'error';
    state.cloudSyncError = (e && e.message) || String(e);
    toast(t('syncConnectFailedToast'));
  }
  render();
}
function disconnectCloudSync(){
  Object.keys(CLOUD.unsubs).forEach(function(k){ if(CLOUD.unsubs[k]) CLOUD.unsubs[k](); });
  CLOUD.unsubs = {};
  CLOUD.db = null; CLOUD.auth = null; CLOUD.uid = null;
  state.cloudSync.enabled = false;
  state.cloudSyncStatus = 'idle';
  saveState();
  toast(t('roomDisconnectedToast'));
  render();
}

function subscribeCollection(name){
  if(CLOUD.unsubs[name]) CLOUD.unsubs[name]();
  CLOUD.unsubs[name] = collRef(name).onSnapshot(function(snapshot){
    var changed = false;
    snapshot.docChanges().forEach(function(change){
      if(change.type === 'removed') return; // 删除走墓碑标记，不做真删
      if(applyRemoteEntity(name, change.doc.data())) changed = true;
    });
    savePushMap();
    if(changed) saveData();
    safeRender();
  }, function(err){
    console.error('sync snapshot error', name, err);
    state.cloudSyncStatus = 'error';
    state.cloudSyncError = (err && err.message) || String(err);
    safeRender();
  });
}
function subscribeFamily(){
  if(CLOUD.unsubs.family) CLOUD.unsubs.family();
  CLOUD.unsubs.family = familyDocRef().onSnapshot(function(doc){
    if(!doc.exists) return;
    var remote = doc.data();
    var localTs = (data.family && data.family.updatedAt) || '';
    if(remote.updatedAt && remote.updatedAt > localTs){
      data.family = remote;
      saveData();
    }
    safeRender();
  }, function(err){ console.error('sync family error', err); });
}

// 合并一条远端记录到本地数组：时间戳更新的一方获胜；deleted 标记视为删除
function applyRemoteEntity(collectionName, remote){
  if(!remote || !remote.id) return false;
  CLOUD.pushMap[collectionName] = CLOUD.pushMap[collectionName] || {};
  CLOUD.pushMap[collectionName][remote.id] = remote.updatedAt;
  var arr = data[collectionName];
  var idx = arr.findIndex(function(x){ return x.id === remote.id; });
  if(remote.deleted){
    if(idx>=0){ arr.splice(idx,1); return true; }
    return false;
  }
  if(idx<0){ arr.push(remote); return true; }
  var localTs = arr[idx].updatedAt || '';
  if(remote.updatedAt && remote.updatedAt > localTs){ arr[idx] = remote; return true; }
  return false;
}

function pushEntity(collectionName, entity){
  if(!cloudSyncActive()) return;
  CLOUD.pushMap[collectionName] = CLOUD.pushMap[collectionName] || {};
  if(CLOUD.pushMap[collectionName][entity.id] === entity.updatedAt) return; // 已推送过这个版本，跳过（防回声）
  collRef(collectionName).doc(entity.id).set(entity, {merge:true}).then(function(){
    CLOUD.pushMap[collectionName][entity.id] = entity.updatedAt;
    savePushMap();
  }).catch(function(e){ console.error('push failed', collectionName, e); });
}
function pushTombstone(collectionName, id){
  if(!cloudSyncActive()) return;
  var ts = nowIso();
  collRef(collectionName).doc(id).set({id:id, deleted:true, updatedAt:ts}, {merge:true}).then(function(){
    CLOUD.pushMap[collectionName] = CLOUD.pushMap[collectionName] || {};
    CLOUD.pushMap[collectionName][id] = ts;
    savePushMap();
  }).catch(function(e){ console.error('push tombstone failed', collectionName, e); });
}
function pushFamily(){
  if(!cloudSyncActive() || !data.family) return;
  familyDocRef().set(data.family, {merge:true}).catch(function(e){ console.error('push family failed', e); });
}
function pushAllLocal(){
  if(!cloudSyncActive()) return;
  if(data.family) pushFamily();
  SYNC_COLLECTIONS.forEach(function(name){
    (data[name]||[]).forEach(function(entity){
      if(!entity.updatedAt) touch(entity);
      pushEntity(name, entity);
    });
  });
  saveData();
}

function copyRoomCode(){
  if(!state.cloudSync.roomCode) return;
  var done = function(){ toast(t('roomCodeCopied')); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(state.cloudSync.roomCode).then(done).catch(done);
  } else { done(); }
}

/* ---------------- 事件绑定 ---------------- */
function bindEvents(){
  document.querySelectorAll('[data-act]').forEach(function(el){
    el.addEventListener('click', function(){
      handleAction(el.getAttribute('data-act'), el.getAttribute('data-id'), el.getAttribute('data-value'), el);
    });
  });
  var fi = document.getElementById('importFile');
  if(fi) fi.addEventListener('change', handleImportFile);

  var fni = document.getElementById('familyNameInput');
  if(fni) fni.addEventListener('input', function(){ draft.familyName = fni.value; });

  var jri = document.getElementById('joinRoomInput');
  if(jri) jri.addEventListener('input', function(){ joinRoomDraft = jri.value; });

  var sci = document.getElementById('settingsRoomCodeInput');
  if(sci) sci.addEventListener('input', function(){ settingsRoomCodeDraft = sci.value; });

  document.querySelectorAll('[data-act="draft-parent-name"]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var p = draft.parents.find(function(x){return x.id===inp.getAttribute('data-id');});
      if(p) p.name = inp.value;
    });
  });
  document.querySelectorAll('[data-act="draft-child-name"],[data-act="draft-child-age"],[data-act="draft-child-height"],[data-act="draft-child-weight"]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var c = draft.children.find(function(x){return x.id===inp.getAttribute('data-id');});
      if(!c) return;
      var act = inp.getAttribute('data-act');
      if(act==='draft-child-name') c.name = inp.value;
      if(act==='draft-child-age') c.age = inp.value;
      if(act==='draft-child-height') c.height = inp.value;
      if(act==='draft-child-weight') c.weight = inp.value;
      if(act==='draft-child-name') updateFinishButtonState();
    });
  });
}
function toggleDisabled(selector, disabled){
  var btn = document.querySelector(selector);
  if(btn) btn.disabled = !!disabled;
}
function updateFinishButtonState(){
  var canFinish = draft.children.some(function(c){ return c.name.trim(); });
  toggleDisabled('[data-act="finish-setup"]', !canFinish);
}

/* ---------------- 动作处理 ---------------- */
function handleAction(act, id, value, el){
  if(act==='go-welcome'){ step='welcome'; render(); }
  else if(act==='go-family'){ step='family'; render(); }
  else if(act==='go-parents'){ step='parents'; render(); }
  else if(act==='go-children'){ step='children'; render(); }
  else if(act==='go-join-room'){ joinRoomDraft=''; step='joinRoom'; render(); }
  else if(act==='do-join-room'){ doJoinRoom(); }
  else if(act==='import-click'){ document.getElementById('importFile').click(); }
  else if(act==='export-backup'){ exportBackup(); }
  else if(act==='set-lang'){ state.lang = value; saveState(); render(); }

  else if(act==='add-draft-parent'){ draft.parents.push({id:uid(), name:'', avatar:'cloud'}); render(); }
  else if(act==='remove-draft-parent'){ draft.parents = draft.parents.filter(function(p){return p.id!==id;}); render(); }
  else if(act==='draft-parent-avatar'){ var p = draft.parents.find(function(x){return x.id===id;}); if(p) p.avatar = value; render(); }

  else if(act==='add-draft-child'){ draft.children.push({id:uid(), name:'', gender:'保密', age:'', height:'', weight:'', avatar:'fish'}); render(); }
  else if(act==='remove-draft-child'){ draft.children = draft.children.filter(function(c){return c.id!==id;}); render(); }
  else if(act==='draft-child-gender'){ var c=draft.children.find(function(x){return x.id===id;}); if(c) c.gender=value; render(); }
  else if(act==='draft-child-avatar'){ var c=draft.children.find(function(x){return x.id===id;}); if(c) c.avatar=value; render(); }

  else if(act==='finish-setup'){ finishSetup(); }
  else if(act==='pick-role'){ roleDraft = value; render(); }
  else if(act==='confirm-role'){ if(roleDraft){ state.deviceRole = roleDraft; saveState(); step='dashboard'; render(); } }

  else if(act==='open-settings'){ settingsJoinInput=false; settingsRoomCodeDraft=''; modal={type:'settings'}; render(); }
  else if(act==='set-device-role'){ state.deviceRole = value; saveState(); render(); }
  else if(act==='create-room'){ connectCloudSync(genRoomCode(), true); }
  else if(act==='open-settings-join'){ settingsJoinInput=true; settingsRoomCodeDraft=''; render(); }
  else if(act==='cancel-settings-join'){ settingsJoinInput=false; render(); }
  else if(act==='do-settings-join'){
    var code = (settingsRoomCodeDraft||'').trim().toUpperCase();
    if(code.length!==8){ toast(t('invalidRoomCodeToast')); return; }
    settingsJoinInput=false;
    connectCloudSync(code, false);
  }
  else if(act==='disconnect-room'){ disconnectCloudSync(); }
  else if(act==='copy-room-code'){ copyRoomCode(); }

  else if(!isParentMode() && ['open-add-parent','open-add-child','ask-delete-child','open-manage-behaviors','open-manage-thresholds','open-add-behavior-form','edit-behavior','save-behavior','confirm-delete-behavior','open-add-threshold-form','save-threshold','delete-threshold'].indexOf(act)>=0){
    // 孩子模式下这些管理类操作一律忽略（入口本来也是隐藏的，这里是双保险）
    return;
  }

  else if(act==='open-add-parent'){ modal = {type:'addParent', form:{name:'', avatar:'cloud'}}; render(); }
  else if(act==='open-add-child'){ modal = {type:'addChild', form:{name:'',gender:'保密',age:'',height:'',weight:'',avatar:'star'}}; render(); }
  else if(act==='open-child'){ modal = {type:'editChild', childId:id, tab:'info'}; render(); }
  else if(act==='close-modal' || act==='close-modal-bg'){ modal=null; render(); }

  else if(act==='modal-add-parent-avatar'){ modal.form.avatar = value; render(); }
  else if(act==='save-add-parent'){ saveAddParent(); }

  else if(act==='modal-add-child-gender'){ modal.form.gender = value; render(); }
  else if(act==='modal-add-child-avatar'){ modal.form.avatar = value; render(); }
  else if(act==='save-add-child'){ saveAddChild(); }

  else if(act==='edit-child-tab'){ modal.tab = value; modal.confirmDelete=false; render(); }
  else if(act==='edit-child-avatar'){ var c = data.children.find(function(x){return x.id===id;}); if(c){ persistEntity('children', c); c.avatar=value; persistEntity('children', c);} render(); }
  else if(act==='edit-child-gender'){ var c = data.children.find(function(x){return x.id===id;}); if(c){ c.gender=value; persistEntity('children', c);} render(); }
  else if(act==='save-edit-child-info'){ saveEditChildInfo(id); }
  else if(act==='ask-delete-child'){ modal.confirmDelete = true; render(); }
  else if(act==='cancel-delete-child'){ modal.confirmDelete = false; render(); }
  else if(act==='confirm-delete-child'){ persistDelete('children', id); modal = null; toast(t('deletedProfileToast')); }
  else if(act==='add-height'){ addGrowthRecord(id, 'height'); }
  else if(act==='add-weight'){ addGrowthRecord(id, 'weight'); }

  else if(act==='log-point'){ addPointLog(id, value); var b=behaviorById(value); toast(b?((b.points>=0?'+':'')+b.points+' '+t('pointsRecordedToast')):''); }
  else if(act==='delete-log'){ deletePointLog(id); render(); }
  else if(act==='open-child-points'){ modal = {type:'editChild', childId:id, tab:'points'}; render(); }

  else if(act==='open-manage-behaviors'){ behaviorForm=null; confirmDeleteBehaviorId=null; modal = {type:'manageBehaviors'}; render(); }
  else if(act==='open-add-behavior-form'){ behaviorForm = {name:'', icon:BEHAVIOR_ICONS[0], category:'学习', sign:'reward', abs:''}; render(); }
  else if(act==='edit-behavior'){
    var b = behaviorById(id);
    if(b) behaviorForm = {id:b.id, name:b.name, icon:b.icon, category:b.category, sign: b.points>=0?'reward':'penalty', abs: Math.abs(b.points)};
    render();
  }
  else if(act==='cancel-behavior-form'){ behaviorForm=null; render(); }
  else if(act==='behavior-category'){ if(behaviorForm) behaviorForm.category=value; render(); }
  else if(act==='behavior-icon'){ if(behaviorForm) behaviorForm.icon=value; render(); }
  else if(act==='behavior-sign'){ if(behaviorForm) behaviorForm.sign=value; render(); }
  else if(act==='save-behavior'){ saveBehavior(); }
  else if(act==='ask-delete-behavior'){ confirmDeleteBehaviorId = id; render(); }
  else if(act==='cancel-delete-behavior'){ confirmDeleteBehaviorId = null; render(); }
  else if(act==='confirm-delete-behavior'){ persistDelete('behaviors', id); confirmDeleteBehaviorId = null; toast(t('behaviorDeletedToast')); }

  else if(act==='open-manage-thresholds'){ thresholdForm=null; modal = {type:'manageThresholds', childId:id}; render(); }
  else if(act==='open-add-threshold-form'){ thresholdForm = {value:'', label:''}; render(); }
  else if(act==='cancel-threshold-form'){ thresholdForm=null; render(); }
  else if(act==='save-threshold'){ saveThreshold(id); }
  else if(act==='delete-threshold'){ persistDelete('thresholds', id); render(); }
  else if(act==='dismiss-alert'){
    var th = data.thresholds.find(function(x){return x.id===id;});
    if(th){ th.dismissed = true; persistEntity('thresholds', th); }
    render();
  }
}

function finishSetup(){
  var cleanParents = draft.parents.filter(function(p){ return p.name.trim(); });
  var ts = nowIso();
  var cleanChildren = draft.children.filter(function(c){ return c.name.trim(); }).map(function(c){
    var heightHistory = c.height ? [{date:todayStr(), value:Number(c.height)}] : [];
    var weightHistory = c.weight ? [{date:todayStr(), value:Number(c.weight)}] : [];
    return Object.assign({}, c, {heightHistory:heightHistory, weightHistory:weightHistory, updatedAt:ts});
  });
  cleanParents.forEach(function(p){ p.updatedAt = ts; });
  data = {
    family: {name: draft.familyName || t('appName'), createdAt: todayStr(), updatedAt: ts},
    parents: cleanParents,
    children: cleanChildren,
    behaviors: defaultBehaviors(),
    pointLogs: [],
    thresholds: [],
    setupDone: true
  };
  saveData();
  roleDraft = null;
  step = 'roleSelect';
  render();
}

async function doJoinRoom(){
  var code = (joinRoomDraft||'').trim().toUpperCase();
  if(!code){ toast(t('needRoomCodeToast')); return; }
  if(code.length!==8){ toast(t('invalidRoomCodeToast')); return; }
  await connectCloudSync(code, false);
  if(state.cloudSync.enabled){
    data.setupDone = true;
    saveData();
    roleDraft = null;
    step = 'roleSelect';
    render();
  }
}

function saveAddParent(){
  var n = document.getElementById('mAddParentName');
  var name = n ? n.value.trim() : '';
  if(!name) { toast(t('fillBehaviorFieldsToast')); return; }
  persistEntity('parents', {id:uid(), name:name, avatar:modal.form.avatar});
  modal = null;
  toast(t('parentAddedToast'));
}

function saveAddChild(){
  var n = document.getElementById('mAddChildName');
  var a = document.getElementById('mAddChildAge');
  var h = document.getElementById('mAddChildHeight');
  var w = document.getElementById('mAddChildWeight');
  var name = n ? n.value.trim() : '';
  if(!name) return;
  var f = modal.form;
  var age = a?a.value:'', height=h?h.value:'', weight=w?w.value:'';
  var heightHistory = height ? [{date:todayStr(), value:Number(height)}] : [];
  var weightHistory = weight ? [{date:todayStr(), value:Number(weight)}] : [];
  persistEntity('children', {
    id:uid(), name:name, gender:f.gender, age:age, height:height, weight:weight,
    avatar:f.avatar, heightHistory:heightHistory, weightHistory:weightHistory
  });
  modal = null;
  toast(t('childAddedToast'));
}

function saveEditChildInfo(childId){
  var c = data.children.find(function(x){return x.id===childId;});
  if(!c) return;
  var n = document.getElementById('mEditChildName');
  var a = document.getElementById('mEditChildAge');
  if(n) c.name = n.value;
  if(a) c.age = a.value;
  persistEntity('children', c);
  toast(t('savedToast'));
  render();
}

function addGrowthRecord(childId, kind){
  var c = data.children.find(function(x){return x.id===childId;});
  if(!c) return;
  var inputId = kind==='height' ? 'mNewHeight' : 'mNewWeight';
  var inp = document.getElementById(inputId);
  var val = inp ? inp.value : '';
  if(!val) return;
  if(kind==='height'){
    c.height = val;
    c.heightHistory = (c.heightHistory||[]).concat([{date:todayStr(), value:Number(val)}]);
  } else {
    c.weight = val;
    c.weightHistory = (c.weightHistory||[]).concat([{date:todayStr(), value:Number(val)}]);
  }
  persistEntity('children', c);
  render();
}

function saveBehavior(){
  var n = document.getElementById('mBehaviorName');
  var a = document.getElementById('mBehaviorAbs');
  var name = n ? n.value.trim() : '';
  var absVal = a ? Number(a.value) : 0;
  if(!name || !absVal){ toast(t('fillBehaviorFieldsToast')); return; }
  var points = behaviorForm.sign === 'penalty' ? -Math.abs(absVal) : Math.abs(absVal);
  if(behaviorForm.id){
    var b = behaviorById(behaviorForm.id);
    if(b){ b.name=name; b.icon=behaviorForm.icon; b.category=behaviorForm.category; b.points=points; persistEntity('behaviors', b); }
    toast(t('behaviorSavedToast'));
  } else {
    persistEntity('behaviors', {id:uid(), name:name, icon:behaviorForm.icon, category:behaviorForm.category, points:points});
    toast(t('behaviorAddedToast'));
  }
  behaviorForm = null;
  render();
}

function saveThreshold(childId){
  var vEl = document.getElementById('mThresholdValue');
  var lEl = document.getElementById('mThresholdLabel');
  var v = vEl ? Number(vEl.value) : NaN;
  if(!vEl || vEl.value === '' || isNaN(v)){ toast(t('fillThresholdValueToast')); return; }
  persistEntity('thresholds', {id:uid(), childId:childId, value:v, label: lEl?lEl.value.trim():'', dismissed:false});
  thresholdForm = null;
  toast(t('thresholdAddedToast'));
  render();
}

/* ---------------- 导出 / 导入备份 ---------------- */
function exportBackup(){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'U-Points-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast(t('backupExportedToast'));
}
function handleImportFile(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var parsed = JSON.parse(ev.target.result);
      if(!parsed.children) throw new Error('bad format');
      data = parsed;
      if(!data.behaviors) data.behaviors = defaultBehaviors();
      if(!data.pointLogs) data.pointLogs = [];
      if(!data.thresholds) data.thresholds = [];
      saveData();
      step = parsed.setupDone ? (state.deviceRole===null?'roleSelect':'dashboard') : 'welcome';
      modal = null;
      toast(t('dataRestoredToast'));
      render();
      if(cloudSyncActive()) pushAllLocal();
    }catch(err){
      alert(t('invalidBackupAlert'));
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---------------- 启动 ---------------- */
render();
if(state.cloudSync.enabled && state.cloudSync.roomCode){
  connectCloudSync(state.cloudSync.roomCode, false);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(e){ console.warn('sw register failed', e); });
  });
}

</script>
