  else if(act==='open-ledger-adjust-form'){ showLedgerAdjustForm=true; render(); }
  else if(act==='cancel-ledger-adjust-form'){ showLedgerAdjustForm=false; render(); }
  else if(act==='save-ledger-adjust'){
    var adjVal = parseFloat(document.getElementById('mLedgerAdjustValue').value) || 0;
    setLedgerAdjustment(id, ledgerCurrency, adjVal);
    showLedgerAdjustForm = false;
    render();
  }
  else if(act==='open-points-adjust-form'){ showPointsAdjustForm=true; render(); }
  else if(act==='cancel-points-adjust-form'){ showPointsAdjustForm=false; render(); }
  else if(act==='save-points-adjust'){
    var pAdjVal = parseFloat(document.getElementById('mPointsAdjustValue').value) || 0;
    setPointsAdjustment(id, pAdjVal);
    showPointsAdjustForm = false;
    render();
  }
  else if(act==='set-activity-level'){ var c = data.children.find(function(x){return x.id===id;}); if(c){ c.activityLevel=value; persistEntity('children', c);} render(); }
  else if(act==='open-calorie-override'){ showCalorieOverrideForm=true; render(); }
  else if(act==='cancel-calorie-override'){ showCalorieOverrideForm=false; render(); }
  else if(act==='save-calorie-override'){
    var c = data.children.find(function(x){return x.id===id;});
    if(c){
      var v = parseFloat(document.getElementById('mCalorieOverride').value);
      c.calorieTargetOverride = (v && v>0) ? v : null;
      persistEntity('children', c);
    }
    showCalorieOverrideForm = false;
    toast(t('targetSavedToast'));
    render();
  }

  else if(act==='set-meal-type'){ mealTypeDraft = value; render(); }
  else if(act==='pick-food'){ selectedFoodRefId = (selectedFoodRefId===value) ? null : value; render(); }
  else if(act==='log-meal'){
    var f = foodLibraryAll().find(function(x){ return x.refId===selectedFoodRefId; });
    var amtEl = document.getElementById('mFoodAmount');
    var amt = amtEl ? parseFloat(amtEl.value) : NaN;
    if(!f || !amt || amt<=0){ return; }
    addMealLog(id, mealTypeDraft, f, amt);
    selectedFoodRefId = null;
    toast(t('mealLoggedToast'));
    render();
  }
  else if(act==='delete-meal-log'){ deleteMealLog(id); render(); }
  else if(act==='toggle-food-show-all'){ mealFoodShowAll = !mealFoodShowAll; render(); }
  else if(act==='open-custom-food'){ showCustomFoodForm=true; customFoodCategoryDraft='other'; customFoodUnitDraft='g'; render(); }
  else if(act==='cancel-custom-food'){ showCustomFoodForm=false; render(); }
  else if(act==='draft-custom-food-category'){ customFoodCategoryDraft = value; render(); }
  else if(act==='draft-custom-food-unit'){ customFoodUnitDraft = value; render(); }
  else if(act==='save-custom-food'){
    var name = document.getElementById('mCustomFoodName').value.trim();
    var baseAmount = parseFloat(document.getElementById('mCustomFoodBaseAmount').value);
    var cal = parseFloat(document.getElementById('mCustomFoodCal').value);
    if(!name || !cal || !baseAmount){ toast(t('fillFoodFieldsToast')); return; }
    var carb = parseFloat(document.getElementById('mCustomFoodCarb').value) || 0;
    var protein = parseFloat(document.getElementById('mCustomFoodProtein').value) || 0;
    var fat = parseFloat(document.getElementById('mCustomFoodFat').value) || 0;
    var food = addCustomFood(name, '', customFoodUnitDraft, baseAmount, cal, carb, protein, fat, customFoodCategoryDraft);
    showCustomFoodForm = false;
    selectedFoodRefId = 'custom:'+food.id;
    render();
  }

  else if(act==='pick-exercise'){ selectedExerciseRefId = (selectedExerciseRefId===value) ? null : value; render(); }
  else if(act==='open-custom-exercise'){ showCustomExerciseForm=true; render(); }
  else if(act==='cancel-custom-exercise'){ showCustomExerciseForm=false; render(); }
  else if(act==='save-custom-exercise'){
    var name2 = document.getElementById('mCustomExName').value.trim();
    var rate = parseFloat(document.getElementById('mCustomExRate').value);
    if(!name2 || !rate){ toast(t('fillExerciseFieldsToast')); return; }
    var ex = addCustomExercise(name2, '', rate);
    showCustomExerciseForm = false;
    selectedExerciseRefId = 'custom:'+ex.id;
    render();
  }
  else if(act==='log-exercise'){
    var exAll = exerciseLibraryAll();
    var selEx = exAll.find(function(x){ return x.refId===selectedExerciseRefId; });
    if(!selEx){ toast(t('selectExerciseFirst')); return; }
    var dur = parseFloat(document.getElementById('mExDuration').value);
    if(!dur || dur<=0){ toast(t('fillExerciseFieldsToast')); return; }
    addExerciseLog(id, selEx, dur);
    selectedExerciseRefId = null;
    toast(t('exerciseLoggedToast'));
    render();
  }
  else if(act==='delete-exercise-log'){ deleteExerciseLog(id); render(); }
  else if(act==='toggle-exercise-show-all'){ exerciseShowAll = !exerciseShowAll; render(); }

  else if(act==='toggle-nutrition-enabled'){
    var c = data.children.find(function(x){return x.id===id;});
    if(c){ var nr = c.nutritionRules || defaultNutritionRules(); nr.enabled = !nr.enabled; c.nutritionRules = nr; persistEntity('children', c); }
    render();
  }
  else if(act==='open-nutrition-settings'){ showNutritionSettings=true; render(); }
  else if(act==='cancel-nutrition-settings'){ showNutritionSettings=false; render(); }
  else if(act==='save-nutrition-settings'){
    var c = data.children.find(function(x){return x.id===id;});
    if(c){
      var nr = c.nutritionRules || defaultNutritionRules();
      var carbV = parseFloat(document.getElementById('mNutriCarbMax').value);
      var proteinV = parseFloat(document.getElementById('mNutriProteinMin').value);
      var fatV = parseFloat(document.getElementById('mNutriFatMax').value);
      var vegV = parseFloat(document.getElementById('mNutriVegTarget').value);
      var fruitV = parseFloat(document.getElementById('mNutriFruitTarget').value);
      nr.carbMaxOverride = (carbV && carbV>0) ? carbV : null;
      nr.proteinMinOverride = (proteinV && proteinV>0) ? proteinV : null;
      nr.fatMaxOverride = (fatV && fatV>0) ? fatV : null;
      nr.vegGramsTarget = (vegV && vegV>=0) ? vegV : nutritionTargets(c).veg;
      nr.fruitGramsTarget = (fruitV && fruitV>=0) ? fruitV : nutritionTargets(c).fruit;
      delete nr.vegServingsTarget; delete nr.fruitServingsTarget;
      nr.points = {
        calorie: parseFloat(document.getElementById('mNutriPtsCalorie').value) || 0,
        carb: parseFloat(document.getElementById('mNutriPtsCarb').value) || 0,
        protein: parseFloat(document.getElementById('mNutriPtsProtein').value) || 0,
        fat: parseFloat(document.getElementById('mNutriPtsFat').value) || 0,
        veg: parseFloat(document.getElementById('mNutriPtsVeg').value) || 0,
        fruit: parseFloat(document.getElementById('mNutriPtsFruit').value) || 0
      };
      c.nutritionRules = nr;
      persistEntity('children', c);
    }
    showNutritionSettings = false;
    toast(t('targetSavedToast'));
    render();
  }
  else if(act==='settle-nutrition'){ settleNutritionToday(id); toast(t('nutritionSettledToast')); render(); }

  else if(act==='open-manage-behaviors'){ behaviorForm=null; confirmDeleteBehaviorId=null; pushScreen({type:'manageBehaviors', childId:id}); }
  else if(act==='open-add-behavior-form'){ behaviorForm = {name:'', icon:BEHAVIOR_ICONS[0], category:'学习', sign:'reward', pointsMode:'fixed', abs:'', rangeMin:'', rangeMax:'', escalate:false, growthDays:14}; render(); }
  else if(act==='edit-behavior'){
    var scrB = currentScreen();
    var b = scrB ? behaviorById(scrB.childId, id) : null;
    if(b){
      var bMode = b.pointsMode || 'fixed';
      if(bMode==='range'){
        behaviorForm = {id:b.id, name:b.name, icon:b.icon, category:b.category, sign: b.pointsMax>=0?'reward':'penalty', pointsMode:'range', abs:'', rangeMin: Math.abs(b.pointsMin), rangeMax: Math.abs(b.pointsMax), escalate:false, growthDays:14};
      } else if(bMode==='checklist'){
        behaviorForm = {id:b.id, name:b.name, icon:b.icon, category:b.category, sign:'reward', pointsMode:'checklist', abs:'', rangeMin:'', rangeMax:'', escalate:false, growthDays:14};
      } else {
        behaviorForm = {id:b.id, name:b.name, icon:b.icon, category:b.category, sign: b.points>=0?'reward':'penalty', pointsMode:'fixed', abs: Math.abs(b.points), rangeMin:'', rangeMax:'', escalate: !!b.escalate, growthDays: b.growthDays || 14};
      }
    }
    render();
  }
  else if(act==='cancel-behavior-form'){ behaviorForm=null; render(); }
  else if(act==='behavior-category'){ if(behaviorForm) behaviorForm.category=value; render(); }
  else if(act==='behavior-icon'){ if(behaviorForm) behaviorForm.icon=value; render(); }
  else if(act==='behavior-sign'){ if(behaviorForm) behaviorForm.sign=value; render(); }
  else if(act==='behavior-points-mode'){ if(behaviorForm) behaviorForm.pointsMode=value; render(); }
  else if(act==='behavior-escalate-mode'){ if(behaviorForm) behaviorForm.escalate = (value==='step'); render(); }
  else if(act==='save-behavior'){ saveBehavior(id); }
  else if(act==='ask-delete-behavior'){ confirmDeleteBehaviorId = id; render(); }
  else if(act==='cancel-delete-behavior'){ confirmDeleteBehaviorId = null; render(); }
  else if(act==='confirm-delete-behavior'){
    var scrD = currentScreen();
    var childD = scrD ? childById(scrD.childId) : null;
    if(childD){ childD.behaviors = (childD.behaviors||[]).filter(function(b){ return b.id!==id; }); persistEntity('children', childD); }
    confirmDeleteBehaviorId = null;
    toast(t('behaviorDeletedToast'));
  }

  else if(act==='open-manage-thresholds'){ thresholdForm=null; pushScreen({type:'manageThresholds', childId:id}); }
  else if(act==='open-add-threshold-form'){ thresholdForm = {value:'', label:''}; render(); }
  else if(act==='cancel-threshold-form'){ thresholdForm=null; render(); }
  else if(act==='save-threshold'){ saveThreshold(id); }
  else if(act==='delete-threshold'){ persistDelete('thresholds', id); render(); }
  else if(act==='dismiss-alert'){
    var th = data.thresholds.find(function(x){return x.id===id;});
    if(th){ th.dismissed = true; persistEntity('thresholds', th); }
    render();
  }
}

function finishSetup(){
  var cleanParents = draft.parents.filter(function(p){ return p.name.trim(); });
  var ts = nowIso();
  var cleanChildren = draft.children.filter(function(c){ return c.name.trim(); }).map(function(c){
    var heightHistory = c.height ? [{date:todayStr(), value:Number(c.height)}] : [];
    var weightHistory = c.weight ? [{date:todayStr(), value:Number(c.weight)}] : [];
    return Object.assign({}, c, {heightHistory:heightHistory, weightHistory:weightHistory, behaviors:defaultBehaviors(), updatedAt:ts});
  });
  cleanParents.forEach(function(p){ p.updatedAt = ts; });
  data = {
    family: {name: draft.familyName || t('appName'), createdAt: todayStr(), updatedAt: ts},
    parents: cleanParents,
    children: cleanChildren,
    pointLogs: [],
    thresholds: [],
    mealLogs: [],
    exerciseLogs: [],
    customFoods: [],
    customExercises: [],
    ledgerLogs: [],
    setupDone: true
  };
  saveData();
  roleDraft = null;
  step = 'roleSelect';
  render();
}

async function doJoinRoom(){
  var code = (joinRoomDraft||'').trim().toUpperCase();
  if(!code){ toast(t('needRoomCodeToast')); return; }
  if(code.length!==8){ toast(t('invalidRoomCodeToast')); return; }
  await connectCloudSync(code, false);
  if(state.cloudSync.enabled){
    data.setupDone = true;
    saveData();
    roleDraft = null;
    step = 'roleSelect';
    render();
  }
}

function saveAddParent(){
  var n = document.getElementById('mAddParentName');
  var name = n ? n.value.trim() : '';
  if(!name) { toast(t('fillBehaviorFieldsToast')); return; }
  persistEntity('parents', {id:uid(), name:name, avatar:screenForm.avatar});
  popScreen();
  toast(t('parentAddedToast'));
}

function saveAddChild(){
  var n = document.getElementById('mAddChildName');
  var a = document.getElementById('mAddChildAge');
  var h = document.getElementById('mAddChildHeight');
  var w = document.getElementById('mAddChildWeight');
  var name = n ? n.value.trim() : '';
  if(!name) return;
  var f = screenForm;
  var age = a?a.value:'', height=h?h.value:'', weight=w?w.value:'';
  var heightHistory = height ? [{date:todayStr(), value:Number(height)}] : [];
  var weightHistory = weight ? [{date:todayStr(), value:Number(weight)}] : [];
  persistEntity('children', {
    id:uid(), name:name, gender:f.gender, age:age, height:height, weight:weight,
    avatar:f.avatar, heightHistory:heightHistory, weightHistory:weightHistory, behaviors:defaultBehaviors()
  });
  popScreen();
  toast(t('childAddedToast'));
}

function saveEditChildInfo(childId){
  var c = data.children.find(function(x){return x.id===childId;});
  if(!c) return;
  var n = document.getElementById('mEditChildName');
  var a = document.getElementById('mEditChildAge');
  if(n) c.name = n.value;
  if(a) c.age = a.value;
  persistEntity('children', c);
  toast(t('savedToast'));
  render();
}

function addGrowthRecord(childId, kind){
  var c = data.children.find(function(x){return x.id===childId;});
  if(!c) return;
  var inputId = kind==='height' ? 'mNewHeight' : 'mNewWeight';
  var inp = document.getElementById(inputId);
  var val = inp ? inp.value : '';
  if(!val) return;
  if(kind==='height'){
    c.height = val;
    c.heightHistory = (c.heightHistory||[]).concat([{date:todayStr(), value:Number(val)}]);
  } else {
    c.weight = val;
    c.weightHistory = (c.weightHistory||[]).concat([{date:todayStr(), value:Number(val)}]);
  }
  persistEntity('children', c);
  render();
}

function saveBehavior(childId){
  var child = childById(childId);
  if(!child) return;
  if(!child.behaviors) child.behaviors = [];
  var n = document.getElementById('mBehaviorName');
  var name = n ? n.value.trim() : '';
  if(!name){ toast(t('fillBehaviorFieldsToast')); return; }
  var pm = behaviorForm.pointsMode || 'fixed';

  var fields = { name:name, icon:behaviorForm.icon, category:behaviorForm.category, pointsMode:pm };

  if(pm==='checklist'){
    fields.points = 0;
    fields.escalate = false;
  } else if(pm==='range'){
    var minEl = document.getElementById('mBehaviorRangeMin');
    var maxEl = document.getElementById('mBehaviorRangeMax');
    var minAbs = minEl ? Math.abs(Number(minEl.value)) : 0;
    var maxAbs = maxEl ? Math.abs(Number(maxEl.value)) : 0;
    if(!minAbs || !maxAbs){ toast(t('fillRangeFieldsToast')); return; }
    var lo = Math.min(minAbs, maxAbs), hi = Math.max(minAbs, maxAbs);
    if(behaviorForm.sign==='penalty'){ fields.pointsMin = -hi; fields.pointsMax = -lo; }
    else { fields.pointsMin = lo; fields.pointsMax = hi; }
    fields.escalate = false;
  } else {
    var a = document.getElementById('mBehaviorAbs');
    var absVal = a ? Number(a.value) : 0;
    if(!absVal){ toast(t('fillBehaviorFieldsToast')); return; }
    fields.points = behaviorForm.sign === 'penalty' ? -Math.abs(absVal) : Math.abs(absVal);
    fields.escalate = behaviorForm.sign === 'penalty' && !!behaviorForm.escalate;
    if(fields.escalate){
      var gEl = document.getElementById('mGrowthDays');
      fields.growthDays = Number(gEl && gEl.value) || 14;
    }
  }

  if(behaviorForm.id){
    var b = child.behaviors.find(function(x){ return x.id===behaviorForm.id; });
    if(b){
      b.name=fields.name; b.icon=fields.icon; b.category=fields.category; b.pointsMode=fields.pointsMode;
      delete b.points; delete b.pointsMin; delete b.pointsMax; delete b.growthDays;
      if(pm==='range'){ b.pointsMin=fields.pointsMin; b.pointsMax=fields.pointsMax; b.escalate=false; }
      else { b.points=fields.points; b.escalate=fields.escalate; if(fields.escalate) b.growthDays=fields.growthDays; }
    }
    toast(t('behaviorSavedToast'));
  } else {
    var newB = {id:uid(), name:fields.name, icon:fields.icon, category:fields.category, pointsMode:fields.pointsMode, escalate: fields.escalate||false};
    if(pm==='range'){ newB.pointsMin=fields.pointsMin; newB.pointsMax=fields.pointsMax; }
    else { newB.points=fields.points; if(fields.escalate) newB.growthDays=fields.growthDays; }
    child.behaviors.push(newB);
    toast(t('behaviorAddedToast'));
  }
  persistEntity('children', child);
  behaviorForm = null;
  render();
}

function saveThreshold(childId){
  var vEl = document.getElementById('mThresholdValue');
  var lEl = document.getElementById('mThresholdLabel');
  var v = vEl ? Number(vEl.value) : NaN;
  if(!vEl || vEl.value === '' || isNaN(v)){ toast(t('fillThresholdValueToast')); return; }
  persistEntity('thresholds', {id:uid(), childId:childId, value:v, label: lEl?lEl.value.trim():'', dismissed:false});
  thresholdForm = null;
  toast(t('thresholdAddedToast'));
  render();
}

/* ---------------- 导出 / 导入备份 ---------------- */
function exportBackup(){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'U-Points-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast(t('backupExportedToast'));
}
function handleImportFile(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var parsed = JSON.parse(ev.target.result);
      if(!parsed.children) throw new Error('bad format');
      data = parsed;
      if(!data.pointLogs) data.pointLogs = [];
      if(!data.thresholds) data.thresholds = [];
      if(!data.mealLogs) data.mealLogs = [];
      if(!data.exerciseLogs) data.exerciseLogs = [];
      if(!data.customFoods) data.customFoods = [];
      if(!data.customExercises) data.customExercises = [];
      if(!data.ledgerLogs) data.ledgerLogs = [];
      (data.children||[]).forEach(function(c){
        if(!c.behaviors || !c.behaviors.length){
          c.behaviors = (data.behaviors && data.behaviors.length) ? JSON.parse(JSON.stringify(data.behaviors)) : defaultBehaviors();
        }
        if(!c.activityLevel) c.activityLevel = 'moderate';
        if(c.calorieTargetOverride === undefined) c.calorieTargetOverride = null;
        if(!c.nutritionRules) c.nutritionRules = defaultNutritionRules();
        if(!c.rewards) c.rewards = [];
        if(!c.penalties) c.penalties = [];
        if(!c.exchangeRates) c.exchangeRates = childExchangeRates(c);
        if(!c.specialOffers) c.specialOffers = [];
      });
      saveData();
      screenStack = [];
      step = parsed.setupDone ? (state.deviceRole===null?'roleSelect':'dashboard') : 'welcome';
      toast(t('dataRestoredToast'));
      render();
      if(cloudSyncActive()) pushAllLocal();
    }catch(err){
      alert(t('invalidBackupAlert'));
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---------------- 启动 ---------------- */
render();
if(state.cloudSync.enabled && state.cloudSync.roomCode){
  connectCloudSync(state.cloudSync.roomCode, false);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(e){ console.warn('sw register failed', e); });
  });
}
