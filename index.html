<title>U-Points</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');
  :root{
    --bg:#FFFCF5; --card:#FFFFFF; --sky:#5AAEE0; --sky-dark:#2B6C93; --sky-light:#E4F4FC;
    --sun:#FFC94A; --sun-light:#FFEFC7; --text:#2E3A42; --muted:#7C8A92; --danger:#E08A5A; --border:#EFE6CF;
    --font-display:'Baloo 2','Nunito',sans-serif; --font-body:'Nunito','Baloo 2',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:linear-gradient(180deg,var(--sky-light) 0%, var(--bg) 340px);font-family:var(--font-body);color:var(--text);}
  #app{max-width:480px;margin:0 auto;padding:24px 18px 60px;position:relative;min-height:100vh;}
  .tap:active{transform:scale(0.94);}
  .tap{transition:transform .12s ease;}
  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}

  .avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(43,108,147,0.18);flex-shrink:0;}
  .avatar.ring{border:3px dashed rgba(255,255,255,0.85);}
  .avatar.rotate{transform:rotate(-6deg);}

  .btn-primary{background:var(--sky);color:#fff;border:none;border-radius:18px;padding:14px 22px;font-family:var(--font-display);font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 6px 14px rgba(90,174,224,.35);display:flex;align-items:center;justify-content:center;gap:6px;width:100%;}
  .btn-primary:disabled{background:#CBD5DA;box-shadow:none;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--sky-dark);border:2px solid var(--sky-light);border-radius:18px;padding:12px 20px;font-family:var(--font-display);font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;}
  .btn-danger{background:var(--danger);color:#fff;border:none;border-radius:18px;padding:14px 22px;font-family:var(--font-display);font-weight:700;font-size:15px;cursor:pointer;width:100%;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-family:var(--font-body);font-weight:700;font-size:14px;color:var(--text);margin-bottom:6px;}
  .field input{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--border);background:#FFFEFB;font-family:var(--font-body);font-size:15px;color:var(--text);outline:none;}

  .segmented{display:flex;background:var(--sky-light);border-radius:14px;padding:4px;margin-bottom:16px;}
  .segmented button{flex:1;border:none;border-radius:11px;padding:10px 8px;font-family:var(--font-body);font-weight:700;font-size:14px;cursor:pointer;background:transparent;color:var(--muted);}
  .segmented button.active{background:#fff;color:var(--sky-dark);box-shadow:0 2px 6px rgba(43,108,147,.15);}

  .avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px;}
  .avatar-pick{position:relative;background:none;border:none;padding:0;cursor:pointer;}
  .avatar-pick .sel-ring{position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--sky-dark);display:none;}
  .avatar-pick.selected .sel-ring{display:block;}

  .step-dots{display:flex;justify-content:center;gap:8px;margin-bottom:22px;}
  .step-dots span{height:8px;border-radius:6px;background:var(--border);transition:all .2s ease;display:inline-block;width:8px;}
  .step-dots span.active{width:22px;background:var(--sun);}

  .card-box{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;border:2px solid var(--border);}
  .dashed-btn{width:100%;border:2px dashed var(--sky);background:transparent;border-radius:18px;padding:14px;color:var(--sky-dark);font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:20px;}

  .modal-mask{position:fixed;inset:0;background:rgba(46,58,66,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-box{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 20px 28px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-title{font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--text);}
  .modal-close{background:var(--sky-light);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--sky-dark);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sky-dark);color:#fff;padding:10px 20px;border-radius:20px;font-family:var(--font-body);font-weight:700;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:60;}

  .child-card{background:var(--card);border:2px solid var(--border);border-radius:22px;padding:16px;text-align:left;cursor:pointer;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px;}
  .row3{display:flex;gap:10px;}
  .row3>div{flex:1;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- 数据与存储 ---------------- */
var LS_PREFIX = 'sunnypoints:';
function storageGet(key, fallback){
  try{
    var raw = window.localStorage.getItem(LS_PREFIX + key);
    if(raw == null) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function storageSet(key, value){
  try{
    window.localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
    return true;
  }catch(e){
    console.error('storage set failed', key, e);
    toast('存储空间可能已满，保存失败');
    return false;
  }
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var AVATARS = [
  {id:'sun', emoji:'☀️', bg:'#FFC94A'},
  {id:'cloud', emoji:'☁️', bg:'#5AAEE0'},
  {id:'star', emoji:'⭐', bg:'#F2A93B'},
  {id:'moon', emoji:'🌙', bg:'#2B6C93'},
  {id:'heart', emoji:'❤️', bg:'#F2955E'},
  {id:'rocket', emoji:'🚀', bg:'#5AAEE0'},
  {id:'fish', emoji:'🐟', bg:'#4FC1D6'},
  {id:'flower', emoji:'🌸', bg:'#F2A93B'},
  {id:'cat', emoji:'🐱', bg:'#F2955E'},
  {id:'dog', emoji:'🐶', bg:'#5AAEE0'},
  {id:'icecream', emoji:'🍦', bg:'#FFC94A'},
  {id:'game', emoji:'🎮', bg:'#2B6C93'}
];
function avatarById(id){
  for(var i=0;i<AVATARS.length;i++) if(AVATARS[i].id===id) return AVATARS[i];
  return AVATARS[0];
}
function avatarHtml(id, size, opts){
  opts = opts || {};
  var a = avatarById(id);
  var cls = 'avatar' + (opts.ring===false?'':' ring') + (opts.rotate?' rotate':'');
  return '<div class="'+cls+'" style="width:'+size+'px;height:'+size+'px;background:'+a.bg+';font-size:'+Math.round(size*0.5)+'px;">'+a.emoji+'</div>';
}

function loadData(){
  var d = storageGet('data', null);
  if(d) return d;
  return { family:null, parents:[], children:[], setupDone:false };
}
var data = loadData();
function saveData(){ storageSet('data', data); }

/* ---------------- 应用状态（当前屏幕/表单）---------------- */
var step = data.setupDone ? 'dashboard' : 'welcome';
var draft = {
  familyName: '',
  parents: [ {id:uid(), name:'', avatar:'sun'} ],
  children: [ {id:uid(), name:'', gender:'保密', age:'', height:'', weight:'', avatar:'star'} ]
};
var modal = null; // {type:'addParent'|'addChild'|'editChild', childId, tab}
var toastMsg = '';
var toastTimer = null;

function toast(msg){
  toastMsg = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastMsg=''; render(); }, 2200);
}

/* ---------------- 渲染 ---------------- */
function render(){
  var app = document.getElementById('app');
  var html = '';
  if(step === 'welcome') html = renderWelcome();
  else if(step === 'family') html = renderFamilyStep();
  else if(step === 'parents') html = renderParentsStep();
  else if(step === 'children') html = renderChildrenStep();
  else html = renderDashboard();

  if(toastMsg) html += '<div class="toast fade-in">'+esc(toastMsg)+'</div>';
  if(modal) html += renderModal();

  app.innerHTML = html;
  bindEvents();
}

function renderWelcome(){
  return ''+

function stepDots(total, current){
  var s = '<div class="step-dots">';
  for(var i=0;i<total;i++) s += '<span class="'+(i===current?'active':'')+'"></span>';
  return s + '</div>';
}

function segmentedHtml(actName, id, value, options){

  options.forEach(function(opt){
    s += '<button type="button" class="'+(value===opt[0]?'active':'')+'" data-act="'+actName+'" data-id="'+id+'" data-value="'+esc(opt[0])+'">'+esc(opt[1])+'</button>';
  });
  return s + '</div>';
}

/* ---------------- 事件绑定 ---------------- */
function bindEvents(){
  document.querySelectorAll('[data-act]').forEach(function(el){
    el.addEventListener('click', function(e){
      var act = el.getAttribute('data-act');
      var id = el.getAttribute('data-id');
      var value = el.getAttribute('data-value');
      handleAction(act, id, value, el);
    });
  });
  var fi = document.getElementById('importFile');
  if(fi) fi.addEventListener('change', handleImportFile);

  // 文本输入实时同步草稿（不需要按钮触发）
  var fni = document.getElementById('familyNameInput');
  if(fni) fni.addEventListener('input', function(){ draft.familyName = fni.value; });

  document.querySelectorAll('[data-act="draft-parent-name"]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var p = draft.parents.find(function(x){return x.id===inp.getAttribute('data-id');});
      if(p) p.name = inp.value;
    });
  });
  document.querySelectorAll('[data-act="draft-child-name"],[data-act="draft-child-age"],[data-act="draft-child-height"],[data-act="draft-child-weight"]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var c = draft.children.find(function(x){return x.id===inp.getAttribute('data-id');});
      if(!c) return;
      var act = inp.getAttribute('data-act');
      if(act==='draft-child-name') c.name = inp.value;
      if(act==='draft-child-age') c.age = inp.value;
      if(act==='draft-child-height') c.height = inp.value;
      if(act==='draft-child-weight') c.weight = inp.value;
      updateFinishButtonState();
    });
  });

  // 弹窗内的文本输入：实时同步表单 + 实时刷新"保存"按钮是否可点
  var mAddParentName = document.getElementById('mAddParentName');
  if(mAddParentName) mAddParentName.addEventListener('input', function(){
    modal.form.name = mAddParentName.value;
    toggleDisabled('[data-act="save-add-parent"]', !modal.form.name.trim());
  });
  var mAddChildName = document.getElementById('mAddChildName');
  if(mAddChildName) mAddChildName.addEventListener('input', function(){
    modal.form.name = mAddChildName.value;
    toggleDisabled('[data-act="save-add-child"]', !modal.form.name.trim());
  });
  ['mAddChildAge','mAddChildHeight','mAddChildWeight'].forEach(function(fid){
    var el2 = document.getElementById(fid);
    if(!el2) return;
    el2.addEventListener('input', function(){
      if(fid==='mAddChildAge') modal.form.age = el2.value;
      if(fid==='mAddChildHeight') modal.form.height = el2.value;
      if(fid==='mAddChildWeight') modal.form.weight = el2.value;
    });
  });
}

// 直接切换按钮的 disabled 状态，不触发整页重绘，避免输入时输入框失焦/光标跳动
function toggleDisabled(selector, disabled){
  var btn = document.querySelector(selector);
  if(btn) btn.disabled = !!disabled;
}
function updateFinishButtonState(){
  var canFinish = draft.children.some(function(c){ return c.name.trim(); });
  toggleDisabled('[data-act="finish-setup"]', !canFinish);
}

function handleAction(act, id, value, el){
  if(act==='go-welcome'){ step='welcome'; render(); }
  else if(act==='go-family'){ step='family'; render(); }
  else if(act==='go-parents'){ step='parents'; render(); }
  else if(act==='go-children'){ step='children'; render(); }
  else if(act==='import-click'){ document.getElementById('importFile').click(); }
  else if(act==='export-backup'){ exportBackup(); }

  else if(act==='add-draft-parent'){ draft.parents.push({id:uid(), name:'', avatar:'cloud'}); render(); }
  else if(act==='remove-draft-parent'){ draft.parents = draft.parents.filter(function(p){return p.id!==id;}); render(); }
  else if(act==='draft-parent-avatar'){
    var p = draft.parents.find(function(x){return x.id===id;}); if(p) p.avatar = value; render();
  }

  else if(act==='add-draft-child'){ draft.children.push({id:uid(), name:'', gender:'保密', age:'', height:'', weight:'', avatar:'fish'}); render(); }
  else if(act==='remove-draft-child'){ draft.children = draft.children.filter(function(c){return c.id!==id;}); render(); }
  else if(act==='draft-child-gender'){ var c=draft.children.find(function(x){return x.id===id;}); if(c) c.gender=value; render(); }
  else if(act==='draft-child-avatar'){ var c=draft.children.find(function(x){return x.id===id;}); if(c) c.avatar=value; render(); }

  else if(act==='finish-setup'){ finishSetup(); }

  else if(act==='open-add-parent'){ modal = {type:'addParent', form:{name:'', avatar:'cloud'}}; render(); }
  else if(act==='open-add-child'){ modal = {type:'addChild', form:{name:'',gender:'保密',age:'',height:'',weight:'',avatar:'star'}}; render(); }
  else if(act==='open-child'){ modal = {type:'editChild', childId:id, tab:'info'}; render(); }
  else if(act==='close-modal' || act==='close-modal-bg'){ modal=null; render(); }

  else if(act==='modal-add-parent-avatar'){ modal.form.avatar = value; syncModalAddParentName(); render(); }
  else if(act==='save-add-parent'){ saveAddParent(); }

  else if(act==='modal-add-child-gender'){ modal.form.gender = value; syncModalAddChildFields(); render(); }
  else if(act==='modal-add-child-avatar'){ modal.form.avatar = value; syncModalAddChildFields(); render(); }
  else if(act==='save-add-child'){ saveAddChild(); }

  else if(act==='edit-child-tab'){ modal.tab = value; modal.confirmDelete=false; render(); }
  else if(act==='edit-child-avatar'){
    var c = data.children.find(function(x){return x.id===id;}); if(c){ c.avatar=value; saveData(); } render();
  }
  else if(act==='edit-child-gender'){
    var c = data.children.find(function(x){return x.id===id;}); if(c){ c.gender=value; saveData(); } render();
  }
  else if(act==='save-edit-child-info'){ saveEditChildInfo(id); }
  else if(act==='ask-delete-child'){ modal.confirmDelete = true; render(); }
  else if(act==='cancel-delete-child'){ modal.confirmDelete = false; render(); }
  else if(act==='confirm-delete-child'){ deleteChild(id); }
  else if(act==='add-height'){ addGrowthRecord(id, 'height'); }
  else if(act==='add-weight'){ addGrowthRecord(id, 'weight'); }
}

function syncModalAddParentName(){
  var inp = document.getElementById('mAddParentName');
  if(inp) modal.form.name = inp.value;
}
function syncModalAddChildFields(){
  var n = document.getElementById('mAddChildName'); if(n) modal.form.name = n.value;
  var a = document.getElementById('mAddChildAge'); if(a) modal.form.age = a.value;
  var h = document.getElementById('mAddChildHeight'); if(h) modal.form.height = h.value;
  var w = document.getElementById('mAddChildWeight'); if(w) modal.form.weight = w.value;
}

function finishSetup(){
  var cleanParents = draft.parents.filter(function(p){ return p.name.trim(); });
  var cleanChildren = draft.children.filter(function(c){ return c.name.trim(); }).map(function(c){
    var heightHistory = c.height ? [{date:todayStr(), value:Number(c.height)}] : [];
    var weightHistory = c.weight ? [{date:todayStr(), value:Number(c.weight)}] : [];
    return Object.assign({}, c, {heightHistory:heightHistory, weightHistory:weightHistory});
  });
  data = {
    family: {name: draft.familyName || '我们家', createdAt: todayStr()},
    parents: cleanParents,
    children: cleanChildren,
    setupDone: true
  };
  saveData();
  step = 'dashboard';
  render();
}

function saveAddParent(){
  syncModalAddParentName();
  if(!modal.form.name.trim()) return;
  data.parents.push({id:uid(), name:modal.form.name.trim(), avatar:modal.form.avatar});
  saveData();
  modal = null;
  toast('家长已添加');
}

function saveAddChild(){
  syncModalAddChildFields();
  if(!modal.form.name.trim()) return;
  var f = modal.form;
  var heightHistory = f.height ? [{date:todayStr(), value:Number(f.height)}] : [];
  var weightHistory = f.weight ? [{date:todayStr(), value:Number(f.weight)}] : [];
  data.children.push({
    id:uid(), name:f.name.trim(), gender:f.gender, age:f.age, height:f.height, weight:f.weight,
    avatar:f.avatar, heightHistory:heightHistory, weightHistory:weightHistory
  });
  saveData();
  modal = null;
  toast('孩子档案已添加');
}

function saveEditChildInfo(childId){
  var c = data.children.find(function(x){return x.id===childId;});
  if(!c) return;
  var n = document.getElementById('mEditChildName');
  var a = document.getElementById('mEditChildAge');
  if(n) c.name = n.value;
  if(a) c.age = a.value;
  saveData();
  toast('已保存');
  render();
}

function deleteChild(childId){
  data.children = data.children.filter(function(c){ return c.id !== childId; });
  saveData();
  modal = null;
  toast('已删除该档案');
}

function addGrowthRecord(childId, kind){
  var c = data.children.find(function(x){return x.id===childId;});
  if(!c) return;
  var inputId = kind==='height' ? 'mNewHeight' : 'mNewWeight';
  var inp = document.getElementById(inputId);
  var val = inp ? inp.value : '';
  if(!val) return;
  if(kind==='height'){
    c.height = val;
    c.heightHistory = (c.heightHistory||[]).concat([{date:todayStr(), value:Number(val)}]);
  } else {
    c.weight = val;
    c.weightHistory = (c.weightHistory||[]).concat([{date:todayStr(), value:Number(val)}]);
  }
  saveData();
  render();
}

/* ---------------- 导出 / 导入备份 ---------------- */
function exportBackup(){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'U-Points-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast('备份已导出 🌤️');
}
function handleImportFile(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var parsed = JSON.parse(ev.target.result);
      if(!parsed.children) throw new Error('格式不对');
      data = parsed;
      saveData();
      step = parsed.setupDone ? 'dashboard' : 'welcome';
      toast('数据已恢复 ✅');
    }catch(err){
      alert('这个文件看起来不是有效的备份文件，请重新选择。');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---------------- 启动 ---------------- */
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(e){
      console.warn('service worker registration failed', e);
    });
  });
}
