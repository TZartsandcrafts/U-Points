<title>有分啦 · U-Points</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');
  :root{
    --bg:#FFFCF5; --card:#FFFFFF; --sky:#5AAEE0; --sky-dark:#2B6C93; --sky-light:#E4F4FC;
    --sun:#FFC94A; --sun-light:#FFEFC7; --text:#2E3A42; --muted:#7C8A92; --danger:#E08A5A; --border:#EFE6CF;
    --food:#F2A93B; --food-light:#FFF3D6; --food-text:#96731C;
    --exercise:#4FAE8A; --exercise-light:#E1F3EC; --exercise-text:#2E7D53;
    --font-display:'Baloo 2','Nunito',sans-serif; --font-body:'Nunito','Baloo 2',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:linear-gradient(180deg,var(--sky-light) 0%, var(--bg) 340px);font-family:var(--font-body);color:var(--text);font-size:16px;line-height:1.55;overflow-x:hidden;}
  #app{max-width:480px;margin:0 auto;padding:max(22px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));position:relative;min-height:100vh;min-height:100dvh;min-height:calc(var(--app-vh, 1vh) * 100);display:flex;flex-direction:column;}
  input, select, textarea, button{font-size:16px;}
  .tap:active{transform:scale(0.96);}
  .tap{transition:transform .12s ease;}
  .fade-in{animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}

  .avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(43,108,147,0.18);flex-shrink:0;}
  .avatar.ring{border:3px dashed rgba(255,255,255,0.85);}
  .avatar.rotate{transform:rotate(-6deg);}

  .btn-primary{background:var(--sky);color:#fff;border:none;border-radius:18px;padding:16px 22px;font-family:var(--font-display);font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 6px 14px rgba(90,174,224,.35);display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;}
  .btn-primary:disabled{background:#CBD5DA;box-shadow:none;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--sky-dark);border:2px solid var(--sky-light);border-radius:18px;padding:14px 20px;font-family:var(--font-display);font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;}
  .btn-danger{background:var(--danger);color:#fff;border:none;border-radius:18px;padding:14px 22px;font-family:var(--font-display);font-weight:700;font-size:16px;cursor:pointer;width:100%;min-height:52px;}

  .field{margin-bottom:18px;}
  .field label{display:block;font-family:var(--font-body);font-weight:700;font-size:15px;color:var(--text);margin-bottom:7px;}
  .field input{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--border);background:#FFFEFB;font-family:var(--font-body);font-size:16px;color:var(--text);outline:none;min-height:50px;}

  .segmented{display:flex;background:var(--sky-light);border-radius:14px;padding:4px;margin-bottom:18px;}
  .segmented button{flex:1;border:none;border-radius:11px;padding:12px 8px;font-family:var(--font-body);font-weight:700;font-size:15px;cursor:pointer;background:transparent;color:var(--muted);min-height:44px;}
  .segmented button.active{background:#fff;color:var(--sky-dark);box-shadow:0 2px 6px rgba(43,108,147,.15);}
  .segmented.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .segmented.scroll button{flex:0 0 auto;white-space:nowrap;padding:12px 16px;font-size:14px;}

  .avatar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px;}
  .avatar-pick{position:relative;background:none;border:none;padding:0;cursor:pointer;}
  .avatar-pick .sel-ring{position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--sky-dark);display:none;}
  .avatar-pick.selected .sel-ring{display:block;}

  .step-dots{display:flex;justify-content:center;gap:8px;margin-bottom:22px;}
  .step-dots span{height:8px;border-radius:6px;background:var(--border);transition:all .2s ease;display:inline-block;width:8px;}
  .step-dots span.active{width:22px;background:var(--sun);}

  .card-box{background:var(--card);border-radius:20px;padding:18px;margin-bottom:16px;border:2px solid var(--border);}
  .dashed-btn{width:100%;border:2px dashed var(--sky);background:transparent;border-radius:18px;padding:16px;color:var(--sky-dark);font-family:var(--font-display);font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:20px;min-height:52px;}

  /* ---- 整页视图（取代原先的底部弹窗），带返回箭头的页头 ---- */
  .screen-header{display:flex;align-items:center;gap:10px;margin-bottom:22px;position:sticky;top:env(safe-area-inset-top);background:var(--bg);padding:4px 0 8px;z-index:5;margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px;}
  .screen-back{background:var(--sky-light);border:none;border-radius:50%;width:44px;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:var(--sky-dark);}
  .screen-title{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--text);flex:1;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sky-dark);color:#fff;padding:12px 22px;border-radius:20px;font-family:var(--font-body);font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:60;max-width:90vw;text-align:center;opacity:0;transition:opacity .2s ease;pointer-events:none;}
  .toast.show{opacity:1;}

  .child-card{background:var(--card);border:2px solid var(--border);border-radius:22px;padding:18px;text-align:left;cursor:pointer;min-height:52px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px;}
  .row3{display:flex;gap:10px;}
  .row3>div{flex:1;}

  .point-pill{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:12px;font-family:var(--font-display);font-weight:700;font-size:15px;}
  .point-pill.pos{background:var(--sky-light);color:var(--sky-dark);}
  .point-pill.neg{background:#FBE4D6;color:var(--danger);}
  .alert-banner{background:#FBE4D6;border:2px solid #F3C4A6;border-radius:18px;padding:16px;margin-bottom:14px;}
  .alert-banner .t{font-family:var(--font-display);font-weight:700;font-size:16px;color:#B5502A;margin-bottom:5px;}
  .alert-banner .d{font-size:14px;color:#8A5230;margin-bottom:12px;line-height:1.5;}
  .chip-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
  .chip{border:none;border-radius:16px;padding:14px 18px;font-family:var(--font-body);font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;width:100%;text-align:left;}
  .chip .chip-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .chip .chip-icon{font-size:21px;flex-shrink:0;}
  .chip .chip-name{overflow-wrap:anywhere;}
  .chip .chip-value{font-family:var(--font-display);font-weight:800;font-size:17px;flex-shrink:0;}
  .chip.reward{background:var(--sky-light);color:var(--sky-dark);}
  .chip.penalty{background:#FBE4D6;color:var(--danger);}
  .log-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
  .log-row .left{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--text);}
  .log-row .meta{font-size:12px;color:var(--muted);}
  .icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px;}
  .icon-pick{background:var(--sky-light);border:none;border-radius:12px;font-size:22px;padding:12px 0;cursor:pointer;min-height:48px;}
  .icon-pick.selected{background:var(--sky);}
  .behavior-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);}
  .behavior-row .name{flex:1;font-size:15px;font-weight:700;color:var(--text);}
  .small-icon-btn{background:var(--sky-light);border:none;cursor:pointer;width:42px;height:42px;min-width:42px;border-radius:50%;color:var(--sky-dark);font-size:18px;display:flex;align-items:center;justify-content:center;}
  .cat-tag{font-size:12px;color:var(--muted);background:var(--sky-light);border-radius:8px;padding:3px 8px;}

  /* ---- 积分月历 ---- */
  .cal-wrap{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:14px 12px 6px;margin-bottom:18px;touch-action:pan-y;}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px;}
  .cal-title{font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--text);}
  .cal-nav-btn{background:var(--sky-light);border:none;border-radius:50%;width:34px;height:34px;min-width:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--sky-dark);}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;font-size:14px;color:var(--text);gap:3px;min-height:44px;background:transparent;}
  .cal-cell.empty{cursor:default;}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--sky);}
  .cal-cell.today .cal-daynum{color:var(--sky-dark);font-weight:800;}
  .cal-cell.selected{background:var(--sky-light);}
  .cal-dots{display:flex;gap:3px;height:6px;min-height:6px;}
  .cal-dot{width:6px;height:6px;border-radius:50%;}
  .cal-dot.reward{background:var(--sky);}
  .cal-dot.penalty{background:var(--danger);}

  .cal-day-title{font-family:var(--font-display);font-weight:700;font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
  .cal-day-sum{font-family:var(--font-display);font-weight:800;font-size:16px;}

  /* ---- 健康打卡：三餐 + 运动 ---- */
  .chip.food{background:var(--food-light);color:var(--food-text);}
  .chip.exercise{background:var(--exercise-light);color:var(--exercise-text);}
  .chip.exercise.selected{box-shadow:inset 0 0 0 2px var(--exercise);}
  .chip.checklist{background:var(--sky-light);color:var(--sky-dark);}
  .chip.checklist.done{background:var(--exercise-light);color:var(--exercise-text);}
  .range-picker{background:var(--card);border:2px dashed var(--border);border-radius:16px;padding:14px;margin:4px 0 18px;}
  .range-picker-title{font-family:var(--font-display);font-weight:700;font-size:14px;margin-bottom:10px;text-align:center;}
  .range-picker-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}

  .macro-line{font-size:13px;color:var(--muted);text-align:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}

  .inline-form .field{margin-bottom:10px;}
  .inline-form .field:last-child{margin-bottom:0;}
  .exercise-log-form{background:var(--exercise-light);border-radius:16px;padding:14px;margin:4px 0 16px;}
  .meal-group-header{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-display);font-weight:800;font-size:14px;color:var(--food-text);background:var(--food-light);border-radius:10px;padding:8px 12px;margin:14px 0 4px;}
  .meal-group-header .meal-group-total{font-size:12px;font-weight:700;opacity:.8;}
  .calorie-preview{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--exercise-text);text-align:center;margin:8px 0;}
  .nutri-row{display:flex;align-items:center;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--border);font-size:14px;}

  .nutri-badge.ok{background:var(--exercise-light);color:var(--exercise-text);}
  .nutri-badge.bad{background:#FBE3D6;color:var(--danger);}

  /* ---- 奖惩兑换 ---- */
  .balance-card{background:linear-gradient(135deg,var(--sky),var(--sky-dark));border-radius:20px;padding:20px;margin-bottom:18px;text-align:center;color:#fff;}
  .balance-card .balance-num{font-family:var(--font-display);font-weight:800;font-size:36px;line-height:1.1;}
  .balance-card .balance-label{font-size:13px;opacity:.9;margin-top:4px;}
  .redeem-card{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;}
  .redeem-card .redeem-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .redeem-card .redeem-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;}
  .redeem-card .redeem-scope{font-size:12px;color:var(--muted);margin-top:4px;}
  .redeem-card .redeem-progress{font-size:13px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:8px;}
  .redeem-card .redeem-actions{margin-top:10px;}
  .redeem-card .redeem-actions button{width:100%;min-height:44px;font-size:14px;}
  .redeem-card .redeem-actions button:disabled{opacity:.45;box-shadow:none;}
  .field select{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--border);background:#FFFEFB;font-family:var(--font-body);font-size:16px;color:var(--text);outline:none;min-height:50px;}

  /* ---- 记账 ---- */
  .balance-card.money{background:linear-gradient(135deg,var(--sun),#E8A93D);color:#5C4108;}
  .rate-card{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px;}
  .rate-card .rate-display{font-family:var(--font-display);font-weight:800;font-size:16px;color:var(--text);text-align:center;}
  .rate-card .offer-banner{background:var(--food-light);color:var(--food-text);border-radius:12px;padding:8px 10px;font-size:13px;text-align:center;margin-top:8px;font-weight:700;}
  .rate-card .exchange-preview{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 10px;}
  .offer-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}

  .offer-row .offer-info{display:flex;flex-direction:column;gap:2px;}

  .ledger-row{padding:10px 0;border-bottom:1px solid var(--border);}
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row .ledger-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .ledger-row .ledger-source{font-size:14px;color:var(--text);font-weight:600;}
  .ledger-row .ledger-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .ledger-row .ledger-amount{font-family:var(--font-display);font-weight:800;font-size:15px;}
  .ledger-row .ledger-amount.pos{color:var(--exercise-text);}
  .ledger-row .ledger-amount.neg{color:var(--danger);}
  .ledger-row.violation{background:#FFF6F1;border-radius:10px;padding:10px 8px;margin-bottom:2px;}
  .ledger-row .ledger-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}

  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
  .settings-row .label{font-size:16px;font-weight:700;color:var(--text);}
  .settings-row .sub{font-size:13px;color:var(--muted);margin-top:2px;}
  .icon-btn-round{width:44px;height:44px;min-width:44px;border-radius:50%;border:none;background:var(--sky-light);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:19px;color:var(--sky-dark);}
  .sync-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;}
  .sync-dot.on{background:#5FAE7C;}
  .sync-dot.off{background:#C8C0AE;}
  .sync-dot.err{background:var(--danger);}
  .room-code-box{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:4px;text-align:center;background:var(--sky-light);border-radius:14px;padding:16px;color:var(--sky-dark);margin:10px 0;}
  .lang-toggle{display:flex;gap:8px;}
  .lang-toggle button{flex:1;border:2px solid var(--border);background:#fff;border-radius:12px;padding:11px;font-family:var(--font-display);font-weight:700;font-size:15px;cursor:pointer;color:var(--muted);min-height:46px;}
  .lang-toggle button.active{border-color:var(--sky);color:var(--sky-dark);background:var(--sky-light);}
  .role-card{border:2px solid var(--border);border-radius:18px;padding:18px;margin-bottom:12px;cursor:pointer;text-align:center;}
  .role-card.active{border-color:var(--sky);background:var(--sky-light);}

  /* ---- 孩子端整页主视图 ---- */
  .child-home-header{text-align:center;padding:10px 0 20px;}
  .child-home-balance{font-family:var(--font-display);font-weight:800;font-size:52px;margin-top:6px;}
  .section-title{font-family:var(--font-display);font-weight:700;font-size:18px;margin:22px 0 12px;}
  .version-tag{text-align:center;color:var(--muted);font-size:12px;margin-top:auto;padding-top:22px;}

<div id="app"></div>
<script>
// 修 iOS Safari / 主屏幕独立打开时的经典 100dvh 坑：
// 冷启动那一刻浏览器工具栏/主屏幕指示条还没"落定"，100dvh 算出来的高度偏大，底部会露出一条空白。
// v3.11.2 的第一版修复用 window.innerHeight 量了一次就定死，结果划一下工具栏收起、
// 视口变高了，这个写死的值不会跟着涨，反而变成"怎么划都消不掉"，比原来更糟——这次改用
// visualViewport API：它专门用来跟踪"工具栏收起/展开导致的可视区域变化"，resize/scroll
// 都会正确触发，值也会跟着实时涨跌，不会再卡死。
(function(){
  function currentViewportHeight(){
    return (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  }
  function setAppVh(){
    document.documentElement.style.setProperty('--app-vh', (currentViewportHeight() * 0.01) + 'px');
  }
  setAppVh();
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', setAppVh);
    window.visualViewport.addEventListener('scroll', setAppVh);
  }
  window.addEventListener('resize', setAppVh);
  window.addEventListener('orientationchange', setAppVh);
  window.addEventListener('pageshow', setAppVh);
  window.addEventListener('scroll', setAppVh, {passive:true});
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) setAppVh(); });
  // 有些机型工具栏收起的动画会晚一点点落定，加载后再补量几次兜底
  window.addEventListener('load', function(){
    setAppVh();
    setTimeout(setAppVh, 100);
    setTimeout(setAppVh, 400);
    setTimeout(setAppVh, 900);
  });
})();
</script>

/* ---------------- 基础存储 ---------------- */
var LS_PREFIX = 'sunnypoints:';
function storageGet(key, fallback){
  try{
    var raw = window.localStorage.getItem(LS_PREFIX + key);
    if(raw == null) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function storageSet(key, value){
  try{
    window.localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
    return true;
  }catch(e){
    console.error('storage set failed', key, e);
    toast(t('storageFullToast'));
    return false;
  }
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function nowIso(){ return new Date().toISOString(); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function t(key, vars){
  var lang = (typeof state!=='undefined' && state.lang) || 'zh';
  var str = (I18N[lang] && I18N[lang][key]) || I18N.zh[key] || key;
  if(vars){
    Object.keys(vars).forEach(function(k){
      str = str.split('{{'+k+'}}').join(vars[k]);
    });
  }
  return str;
}

/* ---------------- 扣分"阶梯翻倍 + 成长期"逻辑 ----------------
   只对扣分类规则(points<0)且开启了 escalate 的规则生效。
   规则：成长期内再犯 = 上次扣分 ×2；成长期外每过一个完整周期就退一级(减半)，
   退到基准分以下就清零，清零后再犯从基准分重新开始（不翻倍）。
   不需要额外存状态——直接用"上一条同规则的记录实际扣了多少分"倒推。 */
function parseLogDT(log){ return new Date(log.date + 'T' + (log.time||'00:00') + ':00'); }

function nextEscalatedPoints(child, behavior){
  var base = Math.abs(behavior.points);
  if(!behavior.escalate) return behavior.points;
  var growthDays = behavior.growthDays || 14;
  var logs = data.pointLogs.filter(function(l){ return l.childId===child.id && l.behaviorId===behavior.id; });
  if(!logs.length) return -base; // 从没触发过，首次按基准分
  logs.sort(function(a,b){ return parseLogDT(a) - parseLogDT(b); });
  var last = logs[logs.length-1];
  var lastR = Math.abs(last.points);
  var gapDays = (new Date() - parseLogDT(last)) / 86400000;
  var windowsElapsed = Math.floor(gapDays / growthDays);
  var R = lastR;
  if(windowsElapsed <= 0){
    R = R * 2; // 成长期内再犯：翻倍
  } else {
    var cleared = false;
    for(var i=0;i<windowsElapsed;i++){
      if(R <= base){ cleared = true; break; }
      R = R / 2;
    }
    R = cleared ? base : R * 2; // 退回后，这次触发仍然是在退回后的基准上翻倍；清零则从基准重新开始
  }
  return -R;
}

function addPointLog(childId, behaviorId, overridePoints){

/* ---------------- 健康打卡：热量目标计算（Mifflin-St Jeor 估算式，仅供参考） ---------------- */
function latestMetricValue(history){
  if(!history || !history.length) return null;
  var sorted = history.slice().sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
  var v = parseFloat(sorted[sorted.length-1].value);
  return isNaN(v) ? null : v;
}
function activityFactor(level){
  var map = {sedentary:1.2, light:1.375, moderate:1.55, active:1.725, very_active:1.9};
  return map[level] || 1.55;
}
function calcBMR(child){
  var w = latestMetricValue(child.weightHistory);
  var h = latestMetricValue(child.heightHistory);
  var age = parseFloat(child.age);
  if(!w || !h || !age) return null;
  var base = 10*w + 6.25*h - 5*age;
  if(child.gender==='男') return base + 5;
  if(child.gender==='女') return base - 161;
  return base - 78; // 性别保密时取男女公式的中间值
}
function calorieTarget(child){
  if(child.calorieTargetOverride) return Math.round(child.calorieTargetOverride);
  var bmr = calcBMR(child);
  if(bmr==null) return null;
  var tdee = bmr * activityFactor(child.activityLevel || 'moderate');
  return Math.round(tdee/10)*10;
}
function macroSuggestion(cal){
  if(!cal) return null;
  return {
    protein: Math.round(cal*0.2/4),
    fat: Math.round(cal*0.3/9),
    carb: Math.round(cal*0.5/4)
  };
}

/* ---------------- 健康打卡：营养达标（与积分奖惩挂钩） ---------------- */
function defaultNutritionRules(){
  return {
    enabled: false,
    carbMaxOverride: null, proteinMinOverride: null, fatMaxOverride: null,
    vegGramsTarget: 300, fruitGramsTarget: 200,
    points: { calorie:3, carb:2, protein:3, fat:2, veg:3, fruit:2 }
  };
}
function nutritionTargets(child){
  var cal = calorieTarget(child);
  var macros = macroSuggestion(cal);
  var nr = child.nutritionRules || defaultNutritionRules();
  return {
    calorie: cal,
    carb: nr.carbMaxOverride || (macros ? macros.carb : null),
    protein: nr.proteinMinOverride || (macros ? macros.protein : null),
    fat: nr.fatMaxOverride || (macros ? macros.fat : null),
    veg: nr.vegGramsTarget != null ? nr.vegGramsTarget : (nr.vegServingsTarget ? nr.vegServingsTarget*100 : 300),
    fruit: nr.fruitGramsTarget != null ? nr.fruitGramsTarget : (nr.fruitServingsTarget ? nr.fruitServingsTarget*100 : 200)
  };
}
function todayNutritionTotals(childId){
  var t = {calories:0, carb:0, protein:0, fat:0, veg:0, fruit:0};
  todayMealLogs(childId).forEach(function(l){
    t.calories += l.calories||0; t.carb += l.carb||0; t.protein += l.protein||0; t.fat += l.fat||0;
    // 蔬菜/水果按实际吃了多少克数累计（不是按次数）；如果这条记录不是按克计量的（比如按个数），退化为用 calories 无关，直接跳过累计克数
    if(l.category==='veg' && l.unit==='g') t.veg += (l.amount||0);
    if(l.category==='fruit' && l.unit==='g') t.fruit += (l.amount||0);
  });
  return t;
}
function nutritionChecklist(child){
  var targets = nutritionTargets(child);
  var totals = todayNutritionTotals(child.id);
  var items = [];
  if(targets.calorie!=null) items.push({key:'calorie', icon:'🔥', name_zh:'热量不超标', name_en:'Calories within limit', ok: totals.calories <= targets.calorie, actual: totals.calories, target: targets.calorie, dir:'max'});
  if(targets.carb!=null) items.push({key:'carb', icon:'🍞', name_zh:'碳水不超标', name_en:'Carbs within limit', ok: totals.carb <= targets.carb, actual: Math.round(totals.carb*10)/10, target: targets.carb, dir:'max'});
  if(targets.protein!=null) items.push({key:'protein', icon:'🍗', name_zh:'蛋白质达标', name_en:'Protein target met', ok: totals.protein >= targets.protein, actual: Math.round(totals.protein*10)/10, target: targets.protein, dir:'min'});
  if(targets.fat!=null) items.push({key:'fat', icon:'🥑', name_zh:'脂肪不超标', name_en:'Fat within limit', ok: totals.fat <= targets.fat, actual: Math.round(totals.fat*10)/10, target: targets.fat, dir:'max'});
  items.push({key:'veg', icon:'🥦', name_zh:'蔬菜达标(g)', name_en:'Veggies target met (g)', ok: totals.veg >= targets.veg, actual: totals.veg, target: targets.veg, dir:'min'});
  items.push({key:'fruit', icon:'🍎', name_zh:'水果达标(g)', name_en:'Fruit target met (g)', ok: totals.fruit >= targets.fruit, actual: totals.fruit, target: targets.fruit, dir:'min'});
  return items;
}
function settleNutritionToday(childId){
  var child = childById(childId);
  if(!child) return;
  var nr = child.nutritionRules || defaultNutritionRules();
  var today = todayStr();
  // 先清掉今天已经结算过的营养积分记录，保证可以重复点击重新结算（比如补记了一顿饭之后）
  data.pointLogs.filter(function(l){ return l.childId===childId && l.date===today && l.source==='nutrition'; })

/* ---------------- 记账：积分兑换零花钱 + 基础流水账 ---------------- */
function childExchangeRates(child){
  if(!child.exchangeRates){
    // 迁移：老数据只有单一 c.exchangeRate（对应第一个币种），其余币种用默认汇率
    var rates = {};
    CURRENCIES.forEach(function(cur){ rates[cur.code] = defaultExchangeRate(); });
    if(child.exchangeRate) rates[CURRENCIES[0].code] = child.exchangeRate;
    return rates;
  }
  return child.exchangeRates;
}
function activeSpecialOffer(child, currency){
  var today = todayStr();
  var offers = (child.specialOffers||[]).filter(function(o){ return (o.currency||CURRENCIES[0].code)===currency && o.startDate<=today && today<=o.endDate; });
  if(!offers.length) return null;
  // 如果同时有多个限时优惠生效，选对孩子最划算的那个（每积分能换到的钱最多）
  offers.sort(function(a,b){ return (b.money/b.points) - (a.money/a.points); });
  return offers[0];
}
function currentExchangeRate(child, currency){
  var special = activeSpecialOffer(child, currency);
  if(special) return { points: special.points, money: special.money, special: special };
  var r = childExchangeRates(child)[currency] || defaultExchangeRate();
  return { points: r.points, money: r.money, special: null };
}
function ledgerBalance(childId, currency){
  var sum = data.ledgerLogs.filter(function(l){ return l.childId===childId && (l.currency||CURRENCIES[0].code)===currency; })
    .reduce(function(s,l){ return s + l.amount; }, 0);
  return Math.round(sum*100)/100;
}
// 排序用精确到毫秒的 ts，而不是只精确到分钟的 date+time 字符串——
// 避免同一分钟内连续记好几笔账时，"最新在前"和余额累加的顺序算错
function ledgerSortKey(l){ return l.ts!=null ? l.ts : parseLogDT(l).getTime(); }
function ledgerEntriesNewestFirst(childId, currency){
  return data.ledgerLogs.filter(function(l){ return l.childId===childId && (l.currency||CURRENCIES[0].code)===currency; })
    .slice().sort(function(a,b){ return ledgerSortKey(b) - ledgerSortKey(a); });
}
function addLedgerEntry(childId, source, amount, category, pointsSpent, currency){
  var log = {
    id: uid(), childId: childId, source: source, amount: Math.round(amount*100)/100, category: category||'other',
    pointsSpent: pointsSpent || null, ts: Date.now(), currency: currency || CURRENCIES[0].code,
    date: todayStr(), time: (new Date()).toTimeString().slice(0,5)
  };
  persistEntity('ledgerLogs', log);
  return log;
}
function deleteLedgerEntry(logId){ persistDelete('ledgerLogs', logId); }
function saveExchangeRate(childId, currency, points, money){
  var child = childById(childId);
  if(!child) return;
  var rates = childExchangeRates(child);
  rates[currency] = { points: points, money: money };
  child.exchangeRates = rates;
  delete child.exchangeRate;

}
function addSpecialOffer(childId, currency, name, startDate, endDate, points, money){
  var child = childById(childId);

function exchangePointsForMoney(childId, currency, pointsToSpend){
  var child = childById(childId);
  if(!child) return null;
  var rate = currentExchangeRate(child, currency);
  var money = Math.round((pointsToSpend / rate.points) * rate.money * 100) / 100;

function loadScriptOnce(src){
  return new Promise(function(resolve, reject){
    if(document.querySelector('script[src="'+src+'"]')){ resolve(); return; }
    var s = document.createElement('script');
    s.src = src;
    s.onload = function(){ resolve(); };
    s.onerror = function(){ reject(new Error('failed to load '+src)); };
    document.head.appendChild(s);
  });
}
function ensureFirebaseSdkLoaded(){
  if(CLOUD.sdkLoadPromise) return CLOUD.sdkLoadPromise;
  var base = 'https://www.gstatic.com/firebasejs/'+FIREBASE_SDK_VERSION+'/';
  CLOUD.sdkLoadPromise = loadScriptOnce(base+'firebase-app-compat.js')
    .then(function(){ return loadScriptOnce(base+'firebase-auth-compat.js'); })
    .then(function(){ return loadScriptOnce(base+'firebase-firestore-compat.js'); });
  return CLOUD.sdkLoadPromise;
}

// 避免云同步引发的重渲染打断正在输入的文本框（iOS 上会导致键盘收起，需要重新点一次才能继续打字）
function safeRender(){
  var ae = document.activeElement;
  if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA')) return;
  render();
}

async function connectCloudSync(roomCode, isNewRoom){
  state.cloudSync.roomCode = roomCode;
  state.cloudSyncStatus = 'connecting';
  state.cloudSyncError = '';
  saveState();
  render();
  try{
    await ensureFirebaseSdkLoaded();
    CLOUD.app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
    CLOUD.auth = firebase.auth();
    CLOUD.db = firebase.firestore();
    var cred = await CLOUD.auth.signInAnonymously();
    CLOUD.uid = cred.user.uid;

    state.cloudSync.enabled = true;
    saveState();

    SYNC_COLLECTIONS.forEach(subscribeCollection);
    subscribeFamily();

    // 首次连接：把本机现有数据也推上去，避免创建/加入房间时丢失本机已有记录
    pushAllLocal();

    state.cloudSyncStatus = 'connected';
    toast(isNewRoom ? t('roomCreatedToast') : t('roomJoinedToast'));
  }catch(e){
    console.error('cloud sync connect failed', e);
    state.cloudSyncStatus = 'error';
    state.cloudSyncError = (e && e.message) || String(e);
    toast(t('syncConnectFailedToast'));
  }
  render();
}
function disconnectCloudSync(){
  Object.keys(CLOUD.unsubs).forEach(function(k){ if(CLOUD.unsubs[k]) CLOUD.unsubs[k](); });
  CLOUD.unsubs = {};
  CLOUD.db = null; CLOUD.auth = null; CLOUD.uid = null;
  state.cloudSync.enabled = false;
  state.cloudSyncStatus = 'idle';
  saveState();
  toast(t('roomDisconnectedToast'));
  render();
}

function subscribeCollection(name){
  if(CLOUD.unsubs[name]) CLOUD.unsubs[name]();
  CLOUD.unsubs[name] = collRef(name).onSnapshot(function(snapshot){
    var changed = false;
    snapshot.docChanges().forEach(function(change){
      if(change.type === 'removed') return; // 删除走墓碑标记，不做真删
      if(applyRemoteEntity(name, change.doc.data())) changed = true;
    });
    savePushMap();
    if(changed) saveData();
    safeRender();
  }, function(err){
    console.error('sync snapshot error', name, err);
    state.cloudSyncStatus = 'error';
    state.cloudSyncError = (err && err.message) || String(err);
    safeRender();
  });
}
function subscribeFamily(){
  if(CLOUD.unsubs.family) CLOUD.unsubs.family();
  CLOUD.unsubs.family = familyDocRef().onSnapshot(function(doc){
    if(!doc.exists) return;
    var remote = doc.data();
    var localTs = (data.family && data.family.updatedAt) || '';
    if(remote.updatedAt && remote.updatedAt > localTs){
      data.family = remote;
      saveData();
    }
    safeRender();
  }, function(err){ console.error('sync family error', err); });
}

// 合并一条远端记录到本地数组：时间戳更新的一方获胜；deleted 标记视为删除
function applyRemoteEntity(collectionName, remote){
  if(!remote || !remote.id) return false;
  CLOUD.pushMap[collectionName] = CLOUD.pushMap[collectionName] || {};
  CLOUD.pushMap[collectionName][remote.id] = remote.updatedAt;
  var arr = data[collectionName];
  var idx = arr.findIndex(function(x){ return x.id === remote.id; });
  if(remote.deleted){
    if(idx>=0){ arr.splice(idx,1); return true; }
    return false;
  }
  if(idx<0){ arr.push(remote); return true; }
  var localTs = arr[idx].updatedAt || '';
  if(remote.updatedAt && remote.updatedAt > localTs){ arr[idx] = remote; return true; }
  return false;
}

function pushEntity(collectionName, entity){
  if(!cloudSyncActive()) return;
  CLOUD.pushMap[collectionName] = CLOUD.pushMap[collectionName] || {};
  if(CLOUD.pushMap[collectionName][entity.id] === entity.updatedAt) return; // 已推送过这个版本，跳过（防回声）
  collRef(collectionName).doc(entity.id).set(entity, {merge:true}).then(function(){
    CLOUD.pushMap[collectionName][entity.id] = entity.updatedAt;
    savePushMap();
  }).catch(function(e){ console.error('push failed', collectionName, e); });
}
function pushTombstone(collectionName, id){
  if(!cloudSyncActive()) return;
  var ts = nowIso();
  collRef(collectionName).doc(id).set({id:id, deleted:true, updatedAt:ts}, {merge:true}).then(function(){
    CLOUD.pushMap[collectionName] = CLOUD.pushMap[collectionName] || {};
    CLOUD.pushMap[collectionName][id] = ts;
    savePushMap();
  }).catch(function(e){ console.error('push tombstone failed', collectionName, e); });
}
function pushFamily(){
  if(!cloudSyncActive() || !data.family) return;
  familyDocRef().set(data.family, {merge:true}).catch(function(e){ console.error('push family failed', e); });
}
function pushAllLocal(){
  if(!cloudSyncActive()) return;
  if(data.family) pushFamily();
  SYNC_COLLECTIONS.forEach(function(name){
    (data[name]||[]).forEach(function(entity){
      if(!entity.updatedAt) touch(entity);
      pushEntity(name, entity);
    });
  });
  saveData();
}

function toast(msg){
  // toast 用独立的常驻 DOM 节点，不参与 render() 的整页重绘——
  // 避免云同步频繁触发重绘时，toast 反复被销毁重建导致的"左右跳动"
  var el = document.getElementById('toastEl');
  if(!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

// 浮动区间行为规则的快速选点：在 min~max 之间按 0.5 为步长列出可选分值（步长细一点方便"做得一般般"选中间值）
function renderRangePicker(child, b){
  var vals = [];
  var step = (b.pointsMax - b.pointsMin) <= 3 ? 0.5 : 1;
  for(var v = b.pointsMin; v <= b.pointsMax + 1e-9; v += step){
    vals.push(Math.round(v*10)/10);
  }
  var nm = behaviorDisplayName(b);
  var btns = vals.map(function(v){
    return '<button type="button" class="range-pick-btn tap" data-act="log-range-point" data-id="'+child.id+'" data-value="'+b.id+'" data-points="'+v+'">'+(v>=0?'+':'')+fmtPts(v)+'</button>';
  }).join('');

    '<div class="range-picker-title">'+esc(b.icon)+' '+esc(nm)+'</div>'+
    '<div class="range-picker-btns">'+btns+'</div>'+

// 一位小数的积分显示：整数就不带小数点，比如 3 而不是 3.0；有小数才显示到小数点后一位
function fmtPts(n){
  n = Math.round(n*10)/10;
  return (n % 1 === 0) ? String(n) : n.toFixed(1);
}

var CAL_MONTH_NAMES_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function getCalState(childId){
  var s = calendarState[childId];
  if(!s){
    var now = new Date();
    s = { y: now.getFullYear(), m: now.getMonth(), sel: todayStr() };
    calendarState[childId] = s;
  }
  return s;
}
function daysInMonth(y, m){ return new Date(y, m+1, 0).getDate(); }
function firstWeekdayOfMonth(y, m){ return new Date(y, m, 1).getDay(); } // 0=周日
function calMonthLabel(y, m){
  if(state.lang==='en') return CAL_MONTH_NAMES_EN[m]+' '+y;
  return y+'年'+(m+1)+'月';
}
function calDayLabel(dateStr){
  var parts = dateStr.split('-');
  var y = parts[0], mo = parseInt(parts[1],10), d = parseInt(parts[2],10);
  if(state.lang==='en') return CAL_MONTH_NAMES_EN[mo-1]+' '+d+', '+y;
  return y+'年'+mo+'月'+d+'日';
}
function shiftCalMonth(cs, delta){
  cs.m += delta;
  while(cs.m < 0){ cs.m += 12; cs.y -= 1; }
  while(cs.m > 11){ cs.m -= 12; cs.y += 1; }
}
function renderCalendar(child){
  var cs = getCalState(child.id);
  var y = cs.y, m = cs.m;
  var dim = daysInMonth(y, m);
  var fw = firstWeekdayOfMonth(y, m);
  var todayS = todayStr();
  var monthPrefix = y+'-'+String(m+1).padStart(2,'0')+'-';

  var monthLogs = data.pointLogs.filter(function(l){ return l.childId===child.id && l.date.indexOf(monthPrefix)===0; });
  var dayFlags = {};
  monthLogs.forEach(function(l){
    var f = dayFlags[l.date] || {reward:false, penalty:false};
    if(l.points >= 0) f.reward = true; else f.penalty = true;
    dayFlags[l.date] = f;
  });

  var weekdayNames = state.lang==='en' ? ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'] : ['日','一','二','三','四','五','六'];
  var weekdaysHtml = weekdayNames.map(function(w){ return '<div>'+w+'</div>'; }).join('');

  var cells = [];
  for(var i=0;i<fw;i++) cells.push(null);
  for(var d=1; d<=dim; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);

  var cellsHtml = cells.map(function(d){
    if(d===null) return '<div class="cal-cell empty"></div>';
    var ds = monthPrefix + String(d).padStart(2,'0');
    var flags = dayFlags[ds];
    var isToday = ds===todayS;
    var isSel = ds===cs.sel;
    var dots = '<div class="cal-dots">'+
      (flags && flags.reward ? '<span class="cal-dot reward"></span>' : '')+
      (flags && flags.penalty ? '<span class="cal-dot penalty"></span>' : '')+
    '</div>';
    return '<div class="cal-cell'+(isToday?' today':'')+(isSel?' selected':'')+'" data-act="cal-select-day" data-id="'+child.id+'" data-value="'+ds+'"><span class="cal-daynum">'+d+'</span>'+dots+'</div>';
  }).join('');

  var selLogs = data.pointLogs.filter(function(l){ return l.childId===child.id && l.date===cs.sel; })
    .slice().sort(function(a,b){ return (a.time||'') < (b.time||'') ? -1 : 1; });
  var selSum = selLogs.reduce(function(s,l){ return s + l.points; }, 0);
  var parentMode = isParentMode();
  var selRows = selLogs.map(function(l){
    var nm = (state.lang==='en' && l.name_en) ? l.name_en : l.name;
    return '<div class="log-row"><div class="left"><span>'+esc(l.icon)+'</span><span>'+esc(nm)+'</span><span class="meta">'+l.time+'</span></div>'+
      '<div style="display:flex;align-items:center;gap:8px;"><span class="point-pill '+(l.points>=0?'pos':'neg')+'">'+(l.points>=0?'+':'')+fmtPts(l.points)+'</span>'+
      (parentMode ? '<button class="small-icon-btn" data-act="delete-log" data-id="'+l.id+'">✕</button>' : '')+'</div></div>';
  }).join('') || '<div style="font-size:14px;color:var(--muted);padding:8px 0;">'+t('calNoLogsForDay')+'</div>';

  return '<div class="section-title">'+t('calendarTitle')+'</div>'+
    '<div class="cal-wrap" data-id="'+child.id+'">'+
      '<div class="cal-header">'+
        '<button class="cal-nav-btn tap" data-act="cal-prev" data-id="'+child.id+'">‹</button>'+
        '<div class="cal-title">'+calMonthLabel(y,m)+'</div>'+
        '<button class="cal-nav-btn tap" data-act="cal-next" data-id="'+child.id+'">›</button>'+
      '</div>'+
      '<div class="cal-weekdays">'+weekdaysHtml+'</div>'+
      '<div class="cal-grid">'+cellsHtml+'</div>'+
      '<div class="cal-day-detail">'+
        '<div class="cal-day-title"><span>'+calDayLabel(cs.sel)+'</span><span class="cal-day-sum" style="color:'+(selSum>=0?'var(--sky-dark)':'var(--danger)')+';">'+(selSum>=0?'+':'')+selSum+'</span></div>'+
        selRows+
      '</div>'+
    '</div>';
}

    anyMeals = true;

    html += '<div class="meal-group-header"><span>'+mealTypeLabel[mt]+'</span><span class="meal-group-total">'+groupCal+' kcal</span></div>';

    html += '<div style="font-size:14px;color:var(--muted);padding:8px 0;">'+t('noMealsToday')+'</div>';
  }
  return html;
}

function renderExerciseChipList(c){
  var query = exerciseSearch.trim().toLowerCase();
  var sorted = exerciseLibrarySorted(c.id);

  function matches(e){
    if(!query) return true;
    var nm = (e.name||'').toLowerCase(), nmEn = (e.name_en||'').toLowerCase();
    return nm.indexOf(query)>=0 || nmEn.indexOf(query)>=0;
  }
  var filtered = sorted.filter(matches);
  var LIMIT = 8;
  var showAll = !!query || exerciseShowAll;
  var toShow = showAll ? filtered : filtered.slice(0, LIMIT);
  var hiddenCount = filtered.length - toShow.length;

  function chipHtml(e){
    var nm = (state.lang==='en' && e.name_en) ? e.name_en : e.name;
    var sel = selectedExerciseRefId === e.refId;
    return '<button class="chip exercise tap'+(sel?' selected':'')+'" data-act="pick-exercise" data-id="'+c.id+'" data-value="'+e.refId+'">'+
      '<span class="chip-left"><span class="chip-icon">'+esc(e.icon)+'</span><span class="chip-name">'+esc(nm)+'</span></span>'+
      '<span class="chip-value">'+e.caloriesPerMin+'/'+(state.lang==='en'?'min':'分')+'</span>'+
    '</button>';
  }

  if(query && !filtered.length){
    return '<div style="font-size:14px;color:var(--muted);padding:10px 2px;text-align:center;">'+t('noExerciseMatchHint')+'</div>';
  }
  var html = '<div class="chip-grid" style="margin-bottom:6px;">'+toShow.map(chipHtml).join('')+'</div>';
  if(!showAll && hiddenCount>0){
    html += '<button class="dashed-btn tap" data-act="toggle-exercise-show-all" style="margin-bottom:4px;">'+t('showMoreExercisesBtn',{n:hiddenCount})+'</button>';
  } else if(exerciseShowAll && !query && filtered.length>LIMIT){
    html += '<button class="dashed-btn tap" data-act="toggle-exercise-show-all" style="margin-bottom:4px;">'+t('showLessExercisesBtn')+'</button>';
  }
  return html;
}

function renderRewardsSubTab(c, parentMode){

    // 手动记账
    html += showManualLedgerForm ?
      '<div class="inline-form">'+
        '<div class="field"><label>'+t('ledgerSourceLabel')+'</label><input id="mLedgerSource" placeholder="'+t('ledgerSourcePlaceholder')+'"></div>'+

      '</div>'
      : '<button class="dashed-btn tap" data-act="open-ledger-form" style="margin-bottom:6px;">'+t('addManualEntryBtn')+'</button>';

    var adj = ledgerAdjustmentLog(c.id, ledgerCurrency);
    html += showLedgerAdjustForm ?
      '<div class="inline-form">'+
        '<div class="field"><label>'+t('initialMoneyLabel')+' ('+currencyName(ledgerCurrency)+')</label><input type="number" step="0.01" id="mLedgerAdjustValue" value="'+(adj?adj.amount:0)+'"></div>'+

        '<button class="btn-primary tap" data-act="save-ledger-adjust" data-id="'+c.id+'">'+t('save')+'</button></div>'+
      '</div>'
      : '<button class="dashed-btn tap" data-act="open-ledger-adjust-form" style="margin-bottom:18px;">'+t('adjustInitialMoneyBtn')+'</button>';
  }

  // 流水记录
  html += '<div class="section-title">'+t('ledgerTab')+'</div>';
  var entriesDesc = ledgerEntriesNewestFirst(c.id, ledgerCurrency);
  if(!entriesDesc.length){
    html += '<div style="font-size:14px;color:var(--muted);padding:14px 2px;text-align:center;">'+t('noLedgerEntries')+'</div>';
  } else {
    // 余额要按时间正序累加，所以先正序算出每一笔之后的余额，再倒序展示
    var entriesAsc = entriesDesc.slice().reverse();
    var running = 0;
    var runningMap = {};
    entriesAsc.forEach(function(l){ running += l.amount; runningMap[l.id] = Math.round(running*100)/100; });
    html += entriesDesc.map(function(l){
      var isViolation = l.category==='violation';
      var catLabel = {grant:t('catGrant'), spending:t('catSpending'), violation:t('catViolation'), other:t('catOtherLedger'), exchange:'', transfer:t('catTransfer'), adjustment:t('catAdjustment')}[l.category] || '';
      var meta = l.date+' '+l.time + (catLabel?(' · '+catLabel):'') + (l.pointsSpent ? t('pointsSpentSuffix',{n:fmtPts(l.pointsSpent)}) : '');
      return '<div class="ledger-row'+(isViolation?' violation':'')+'">'+
        '<div class="ledger-top"><span class="ledger-source">'+(isViolation?'⚠️ ':'')+esc(l.source)+'</span>'+
        '<span class="ledger-amount '+(l.amount>=0?'pos':'neg')+'">'+(l.amount>=0?'+':'')+sym+fmtMoney(Math.abs(l.amount))+'</span></div>'+
        '<div class="ledger-bottom"><span class="ledger-meta">'+esc(meta)+'</span>'+
        '<span class="ledger-meta">'+t('balanceAfterLabel')+' '+sym+fmtMoney(runningMap[l.id])+'</span></div>'+
        (parentMode ? '<div style="text-align:right;margin-top:4px;"><button class="small-icon-btn" data-act="delete-ledger-entry" data-id="'+l.id+'">✕</button></div>' : '')+
      '</div>';
    }).join('');
  }

  return html;
}
// 金额显示：默认不强行补两位小数，但保留最多两位小数（比如 10 不显示成 10.00，10.5 保留 10.5，10.256 四舍五入成 10.26）
function fmtMoney(n){
  n = Math.round(n*100)/100;
  return String(n);
}

/* ---------------- 顶层渲染 ---------------- */
function render(){
  var app = document.getElementById('app');
  // 重绘前先把当前所有输入框的值记下来，重绘后原样恢复——
  // 避免"点了下头像/性别，刚打的字就被清空"这种数据丢失问题
  var preserved = {};
  app.querySelectorAll('input[id]').forEach(function(inp){ preserved[inp.id] = inp.value; });

  var html = '';
  var scr = currentScreen();
  if(scr){
    html = renderScreen(scr);
  } else if(step === 'welcome') html = renderWelcome();
  else if(step === 'joinRoom') html = renderJoinRoom();
  else if(step === 'family') html = renderFamilyStep();
  else if(step === 'parents') html = renderParentsStep();
  else if(step === 'children') html = renderChildrenStep();
  else if(step === 'roleSelect') html = renderRoleSelect();
  else if(step === 'pickYourself') html = renderPickYourself();
  else if(!isParentMode() && boundChild()) html = renderChildHome();
  else html = renderDashboard();

  // toast 是独立管理的 DOM 节点，不再拼进这里的整页 HTML 里（见 toast() 函数）

  app.innerHTML = html;

  // 恢复重绘前记下的输入内容（只在对应 id 的输入框仍然存在时才恢复）
  Object.keys(preserved).forEach(function(id){
    var el = document.getElementById(id);
    if(el && preserved[id] !== '') el.value = preserved[id];
  });

  bindEvents();
}

  var rewardChips = rewards.map(function(b){ return renderPointChip(c, b); }).join('') || '<div style="font-size:14px;color:var(--muted);">'+t('noRewards')+'</div>';
  var penaltyChips = penalties.map(function(b){ return renderPointChip(c, b); }).join('') || '<div style="font-size:14px;color:var(--muted);">'+t('noPenalties')+'</div>';
  var checklistChips = checklist.map(function(b){ return renderPointChip(c, b); }).join('');

  html += '<div class="section-title">'+t('rewardSection')+'</div><div class="chip-grid">'+rewardChips+'</div>';
  html += '<div class="section-title">'+t('penaltySection')+'</div><div class="chip-grid">'+penaltyChips+'</div>';
  if(checklist.length){ html += '<div class="section-title">'+t('checklistSection')+'</div><div class="chip-grid">'+checklistChips+'</div>'; }
  if(selectedRangeBehaviorId){
    var selRB = childBehaviors.find(function(b){ return b.id===selectedRangeBehaviorId; });
    if(selRB) html += renderRangePicker(c, selRB);
  }

  html += renderCalendar(c);

  var logRows = logs.map(function(l){
    var nm = (state.lang==='en' && l.name_en) ? l.name_en : l.name;
    return '<div class="log-row"><div class="left"><span style="font-size:20px;">'+esc(l.icon)+'</span><span>'+esc(nm)+'</span><span class="meta">'+l.date+' '+l.time+'</span></div>'+
      '<span class="point-pill '+(l.points>=0?'pos':'neg')+'">'+(l.points>=0?'+':'')+l.points+'</span></div>';
  }).join('') || '<div style="font-size:14px;color:var(--muted);padding:8px 0;">'+t('noLogs')+'</div>';
  html += '<div class="section-title">'+t('recentLogs')+'</div><div>'+logRows+'</div>';

  html += '<div style="margin-top:22px;">'+
    '<button class="btn-ghost tap" data-act="open-child-health" data-id="'+c.id+'" style="margin-bottom:10px;">🍎 '+t('healthTab')+'</button>'+
    '<button class="btn-ghost tap" data-act="open-child-redeem" data-id="'+c.id+'" style="margin-bottom:10px;">🎁 '+t('redeemTab')+'</button>'+
    '<button class="btn-ghost tap" data-act="open-child-ledger" data-id="'+c.id+'" style="margin-bottom:10px;">💰 '+t('ledgerTab')+'</button>'+
    '<button class="btn-ghost tap" data-act="open-my-profile" data-id="'+c.id+'">✏️ '+t('editMyProfile')+'</button>'+
  '</div>';
  html += '<div class="version-tag">'+t('versionLabel')+' '+APP_VERSION+'</div>';
  return html;
}

/* ---------------- 整页视图（设置/孩子档案/行为规则/阈值/添加家长孩子）---------------- */
function renderScreen(scr){
  if(scr.type === 'settings') return renderSettingsScreen();
  if(scr.type === 'addParent') return renderAddParentScreen();
  if(scr.type === 'addChild') return renderAddChildScreen();
  if(scr.type === 'editChild') return renderEditChildScreen(scr);
  if(scr.type === 'manageBehaviors') return renderManageBehaviorsScreen(scr);
  if(scr.type === 'manageThresholds') return renderManageThresholdsScreen(scr);
  return '';
}

function renderManageBehaviorsScreen(scr){
  var child = childById(scr.childId);
  if(!child){ popScreen(); return ''; }
  var list = child.behaviors || [];
  var rows = list.map(function(b){
    if(confirmDeleteBehaviorId === b.id){
      return '<div class="behavior-row"><div class="name" style="color:var(--danger);font-size:14px;">'+t('deleteBehaviorConfirm',{name:esc(behaviorDisplayName(b))})+'</div>'+
        '<button class="btn-ghost tap" style="width:auto;padding:8px 12px;min-height:auto;" data-act="cancel-delete-behavior">'+t('reallyThink')+'</button>'+
        '<button class="small-icon-btn" style="color:var(--danger);" data-act="confirm-delete-behavior" data-id="'+b.id+'">✓</button></div>';
    }
    var catKey = {'学习':'catStudy','生活':'catLife','礼貌':'catManner','家务':'catChore','其他':'catOther'}[b.category] || 'catOther';
    var mode = b.pointsMode || 'fixed';
    var valueHtml;
    if(mode==='checklist'){
      valueHtml = '<span class="point-pill" style="background:var(--sky-light);color:var(--sky-dark);">✔️</span>';
    } else if(mode==='range'){
      valueHtml = '<span class="point-pill '+(b.pointsMax>=0?'pos':'neg')+'">'+(b.pointsMax>=0?'+':'')+fmtPts(b.pointsMin)+'~'+fmtPts(b.pointsMax)+'</span>';
    } else {
      valueHtml = '<span class="point-pill '+(b.points>=0?'pos':'neg')+'">'+(b.points>=0?'+':'')+fmtPts(b.points)+'</span>';
    }
    return '<div class="behavior-row">'+
      '<span style="font-size:22px;">'+esc(b.icon)+'</span>'+
      '<div class="name">'+esc(behaviorDisplayName(b))+' <span class="cat-tag">'+esc(t(catKey))+'</span>'+(b.escalate?' <span class="cat-tag" style="background:var(--sun-light);color:#8A6A2C;">🌱 '+esc(t('escalateModeStep'))+'</span>':'')+'</div>'+
      valueHtml+
      '<button class="small-icon-btn" data-act="edit-behavior" data-id="'+b.id+'">✏️</button>'+
      '<button class="small-icon-btn" data-act="ask-delete-behavior" data-id="'+b.id+'">🗑</button>'+
    '</div>';
  }).join('') || '<div style="font-size:14px;color:var(--muted);padding:8px 0;">'+t('noBehaviors')+'</div>';

      '<div class="field"><label>'+t('behaviorNameLabel')+'</label><input id="mBehaviorName" value="'+esc(f.name)+'" placeholder="'+t('behaviorNamePlaceholder')+'"></div>'+
      '<div class="field"><label>'+t('categoryLabel')+'</label>'+segmentedHtml('behavior-category', '_', f.category, categoryOptions())+'</div>'+
      '<div class="field"><label>'+t('iconLabel')+'</label></div>'+
      '<div class="icon-grid">'+BEHAVIOR_ICONS.map(function(ic){
        return '<button type="button" class="icon-pick tap'+(f.icon===ic?' selected':'')+'" data-act="behavior-icon" data-value="'+ic+'">'+ic+'</button>';
      }).join('')+'</div>'+
      '<div class="field"><label>'+t('pointsModeLabel')+'</label>'+segmentedHtml('behavior-points-mode', '_', pm, [['fixed',t('pointsModeFixed')],['range',t('pointsModeRange')],['checklist',t('pointsModeChecklist')]])+'</div>'+
      (pm!=='checklist' ? '<div class="field"><label>'+t('signLabel')+'</label>'+segmentedHtml('behavior-sign', '_', f.sign, [['reward',t('signReward')],['penalty',t('signPenalty')]])+'</div>' : '')+
      (pm==='fixed' ? '<div class="field"><label>'+t('pointValueLabel')+'</label><input type="number" step="0.1" id="mBehaviorAbs" value="'+esc(f.abs)+'" placeholder="'+t('pointValuePlaceholder')+'"></div>' : '')+
      (pm==='range' ? (''+
        '<div class="field"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'+
          '<div><span style="font-size:12px;color:var(--muted);">'+t('rangeMinLabel')+'</span><input type="number" step="0.1" id="mBehaviorRangeMin" value="'+esc(f.rangeMin)+'" placeholder="1"></div>'+
          '<div><span style="font-size:12px;color:var(--muted);">'+t('rangeMaxLabel')+'</span><input type="number" step="0.1" id="mBehaviorRangeMax" value="'+esc(f.rangeMax)+'" placeholder="5"></div>'+
        '</div></div>'+
        '<div style="font-size:12px;color:var(--muted);margin:-10px 0 16px;line-height:1.5;">'+t('rangeHint')+'</div>'
      ) : '')+
      (pm==='checklist' ? '<div style="font-size:13px;color:var(--muted);margin:-6px 0 16px;line-height:1.5;">'+t('checklistHint')+'</div>' : '')+
      (pm==='fixed' && f.sign==='penalty' ? (''+
        '<div class="field"><label>'+t('escalateModeLabel')+'</label>'+segmentedHtml('behavior-escalate-mode', '_', f.escalate?'step':'fixed', [['fixed',t('escalateModeFixed')],['step',t('escalateModeStep')]])+'</div>'+
        (f.escalate ? (''+
          '<div class="field"><label>'+t('growthPeriodLabel')+'</label><input type="number" id="mGrowthDays" value="'+esc(f.growthDays)+'" placeholder="'+t('growthPeriodPlaceholder')+'"></div>'+
          '<div style="font-size:13px;color:var(--muted);margin:-10px 0 16px;line-height:1.5;">🌱 '+t('growthPeriodHint')+'</div>'
        ) : '')
      ) : '')+
      '<div style="display:flex;gap:10px;">'+
        '<button class="btn-ghost tap" data-act="cancel-behavior-form">'+t('cancel')+'</button>'+
        '<button class="btn-primary tap" data-act="save-behavior" data-id="'+child.id+'">'+t('save')+'</button>'+
      '</div>'+
    '</div>';
  }
  return screenHeader(t('behaviorsTitleForChild',{name:esc(child.name)})) +
    '<div style="font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.5;">'+t('behaviorsDesc')+'</div>'+
    rows + (behaviorForm ? '' : '<button class="dashed-btn tap" style="margin-top:16px;" data-act="open-add-behavior-form">'+t('addBehaviorRule')+'</button>') + formHtml;

  if(parentMode){

          '<button class="btn-ghost tap" style="color:var(--danger);border-color:#F6DCC9;" data-act="disconnect-room">'+t('disconnectRoomBtn')+'</button>'+
        '</div>';
    } else if(settingsJoinInput){
      body += '<div class="field"><input id="settingsRoomCodeInput" value="'+esc(settingsRoomCodeDraft)+'" placeholder="'+t('roomCodePlaceholder')+'" style="text-align:center;font-family:var(--font-display);font-weight:800;letter-spacing:3px;text-transform:uppercase;"></div>'+
        '<div style="display:flex;gap:10px;margin-bottom:18px;">'+
          '<button class="btn-ghost tap" data-act="cancel-settings-join">'+t('cancel')+'</button>'+
          '<button class="btn-primary tap" data-act="do-settings-join">'+t('joinBtn')+'</button>'+
        '</div>';
    } else {
      body += '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px;">'+
        '<button class="btn-primary tap" data-act="create-room">🔗 '+t('createRoomBtn')+'</button>'+
        '<button class="btn-ghost tap" data-act="open-settings-join">'+t('joinRoomBtn')+'</button>'+
      '</div>';
    }

    body += '<div class="settings-row"><div class="label">'+t('dataSectionTitle')+'</div></div>'+
      '<div style="display:flex;gap:10px;margin-top:10px;">'+
        '<button class="btn-ghost tap" data-act="export-backup">⬇ '+t('exportBackup')+'</button>'+
        '<button class="btn-ghost tap" data-act="import-click">⬆ '+t('importBackup')+'</button>'+
        '<input type="file" id="importFile" accept=".json" style="display:none;">'+
      '</div>';
  }

  body += '<div style="text-align:center;color:var(--muted);font-size:13px;margin-top:20px;line-height:1.6;">'+t('footerNote1')+'<br>'+t('footerNote2')+'</div>';
  body += '<div class="version-tag">'+t('versionLabel')+' '+APP_VERSION+' · '+APP_BUILD_DATE+'</div>';
  return screenHeader(t('settingsTitle')) + body;
}

/* ---------------- 事件绑定 ---------------- */
function bindEvents(){
  document.querySelectorAll('[data-act]').forEach(function(el){
    el.addEventListener('click', function(){
      handleAction(el.getAttribute('data-act'), el.getAttribute('data-id'), el.getAttribute('data-value'), el);
    });
  });
  var fi = document.getElementById('importFile');
  if(fi) fi.addEventListener('change', handleImportFile);

  var fni = document.getElementById('familyNameInput');
  if(fni) fni.addEventListener('input', function(){ draft.familyName = fni.value; });

  var jri = document.getElementById('joinRoomInput');
  if(jri) jri.addEventListener('input', function(){ joinRoomDraft = jri.value; });

  var sci = document.getElementById('settingsRoomCodeInput');
  if(sci) sci.addEventListener('input', function(){ settingsRoomCodeDraft = sci.value; });

  document.querySelectorAll('[data-act="draft-parent-name"]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var p = draft.parents.find(function(x){return x.id===inp.getAttribute('data-id');});
      if(p) p.name = inp.value;
    });
  });
  document.querySelectorAll('[data-act="draft-child-name"],[data-act="draft-child-age"],[data-act="draft-child-height"],[data-act="draft-child-weight"]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var c = draft.children.find(function(x){return x.id===inp.getAttribute('data-id');});
      if(!c) return;
      var act = inp.getAttribute('data-act');
      if(act==='draft-child-name'){ c.name = inp.value; updateFinishButtonState(); }
      if(act==='draft-child-age') c.age = inp.value;
      if(act==='draft-child-height') c.height = inp.value;
      if(act==='draft-child-weight') c.weight = inp.value;
    });
  });

  // 积分月历：左右滑动无限翻页切换月份
  document.querySelectorAll('.cal-wrap').forEach(function(wrap){
    var startX = null, startY = null, moved = false;
    wrap.addEventListener('touchstart', function(e){
      if(e.touches.length !== 1) return;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY; moved = false;
    }, {passive:true});
    wrap.addEventListener('touchmove', function(){ if(startX!==null) moved = true; }, {passive:true});
    wrap.addEventListener('touchend', function(e){
      if(startX===null || !moved){ startX = null; return; }
      var t = e.changedTouches && e.changedTouches[0];
      var dx = t ? t.clientX - startX : 0;
      var dy = t ? t.clientY - startY : 0;
      startX = null;
      if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5){
        var childId = wrap.getAttribute('data-id');
        shiftCalMonth(getCalState(childId), dx < 0 ? 1 : -1);
        render();
      }
    });
  });

  // 三餐/运动搜索框：只局部刷新食物/运动列表，不触发整页 render()，
  // 这样输入过程中光标和焦点不会被打断（跟"点头像不清空文字"是同一个思路）
  function bindScoped(container){
    if(!container) return;
    container.querySelectorAll('[data-act]').forEach(function(el){
      el.addEventListener('click', function(){
        handleAction(el.getAttribute('data-act'), el.getAttribute('data-id'), el.getAttribute('data-value'), el);
      });
    });
  }
  var scr = currentScreen();
  var editingChild = (scr && scr.type==='editChild') ? childById(scr.childId) : null;
  var foodSearchInput = document.getElementById('mFoodSearch');
  if(foodSearchInput && editingChild){
    foodSearchInput.addEventListener('input', function(){
      mealFoodSearch = foodSearchInput.value;
      var wrap = document.getElementById('mealFoodListWrap');
      if(wrap){ wrap.innerHTML = renderFoodChipList(editingChild); bindScoped(wrap); }
    });
  }
  var exerciseSearchInput = document.getElementById('mExerciseSearch');
  if(exerciseSearchInput && editingChild){
    exerciseSearchInput.addEventListener('input', function(){
      exerciseSearch = exerciseSearchInput.value;
      var wrap = document.getElementById('exerciseListWrap');
      if(wrap){ wrap.innerHTML = renderExerciseChipList(editingChild); bindScoped(wrap); }
    });
  }
  var exchangePointsInput = document.getElementById('mExchangePoints');
  if(exchangePointsInput && editingChild){
    exchangePointsInput.addEventListener('input', function(){
      var previewEl = document.getElementById('mExchangePreview');
      if(!previewEl) return;
      var pts = parseFloat(exchangePointsInput.value) || 0;
      var rate = currentExchangeRate(editingChild, ledgerCurrency);
      var money = Math.round((pts / rate.points) * rate.money * 100) / 100;
      previewEl.textContent = t('exchangePreviewLabel')+'：'+currencySymbol(ledgerCurrency)+fmtMoney(money);
    });
  }
  var transferAmountInput = document.getElementById('mTransferAmount');
  var transferRateInput = document.getElementById('mTransferRate');
  if(transferAmountInput && transferRateInput && editingChild){
    var updateTransferPreview = function(){
      var previewEl = document.getElementById('mTransferPreview');
      if(!previewEl) return;
      var amt = parseFloat(transferAmountInput.value) || 0;
      var rateVal = parseFloat(transferRateInput.value) || 0;
      var toAmt = Math.round(amt * rateVal * 100) / 100;
      previewEl.textContent = t('transferPreviewLabel')+'：'+currencySymbol(transferToCurrencyDraft)+fmtMoney(toAmt);
    };
    transferAmountInput.addEventListener('input', updateTransferPreview);
    transferRateInput.addEventListener('input', updateTransferPreview);
  }
  var foodAmountInput = document.getElementById('mFoodAmount');
  if(foodAmountInput && editingChild && selectedFoodRefId){
    var updateFoodPreview = function(){
      var previewEl = document.getElementById('mFoodAmountPreview');
      if(!previewEl) return;
      var f = foodLibraryAll().find(function(x){ return x.refId===selectedFoodRefId; });
      if(!f) return;
      var amt = parseFloat(foodAmountInput.value) || 0;
      var s = scaleFoodValues(f, amt);
      previewEl.textContent = s.calories+' kcal · '+t('carbGLabel')+' '+s.carb+' · '+t('proteinGLabel')+' '+s.protein+' · '+t('fatGLabel')+' '+s.fat;
    };
    foodAmountInput.addEventListener('input', updateFoodPreview);
    updateFoodPreview();
  }
}
function toggleDisabled(selector, disabled){
  var btn = document.querySelector(selector);
  if(btn) btn.disabled = !!disabled;
}
function updateFinishButtonState(){
  var canFinish = draft.children.some(function(c){ return c.name.trim(); });
  toggleDisabled('[data-act="finish-setup"]', !canFinish);
}

/* ---------------- 动作处理 ---------------- */
function handleAction(act, id, value, el){
  if(act==='nav-back'){ popScreen(); return; }
  if(act==='go-welcome'){ step='welcome'; render(); }
  else if(act==='go-family'){ step='family'; render(); }
  else if(act==='go-parents'){ step='parents'; render(); }
  else if(act==='go-children'){ step='children'; render(); }
  else if(act==='go-join-room'){ joinRoomDraft=''; step='joinRoom'; render(); }
  else if(act==='do-join-room'){ doJoinRoom(); }
  else if(act==='import-click'){ document.getElementById('importFile').click(); }
  else if(act==='export-backup'){ exportBackup(); }
  else if(act==='set-lang'){ state.lang = value; saveState(); render(); }

  else if(act==='add-draft-parent'){ draft.parents.push({id:uid(), name:'', avatar:'cloud'}); render(); }
  else if(act==='remove-draft-parent'){ draft.parents = draft.parents.filter(function(p){return p.id!==id;}); render(); }
  else if(act==='draft-parent-avatar'){ var p = draft.parents.find(function(x){return x.id===id;}); if(p) p.avatar = value; render(); }

  else if(act==='add-draft-child'){ draft.children.push({id:uid(), name:'', gender:'保密', age:'', height:'', weight:'', avatar:'fish'}); render(); }
  else if(act==='remove-draft-child'){ draft.children = draft.children.filter(function(c){return c.id!==id;}); render(); }
  else if(act==='draft-child-gender'){ var c=draft.children.find(function(x){return x.id===id;}); if(c) c.gender=value; render(); }
  else if(act==='draft-child-avatar'){ var c=draft.children.find(function(x){return x.id===id;}); if(c) c.avatar=value; render(); }

  else if(act==='finish-setup'){ finishSetup(); }
  else if(act==='pick-role'){ roleDraft = value; render(); }
  else if(act==='confirm-role'){
    if(roleDraft){
      state.deviceRole = roleDraft; saveState();
      if(roleDraft==='child'){ step='pickYourself'; } else { step='dashboard'; }
      render();
    }
  }
  else if(act==='pick-yourself'){ state.boundChildId = id; saveState(); step='dashboard'; render(); }
  else if(act==='switch-child'){ state.boundChildId = null; saveState(); screenStack=[]; step='pickYourself'; render(); }
  else if(act==='open-my-profile'){ editChildTab='info'; confirmDeleteChild=false; pushScreen({type:'editChild', childId:id}); }

  else if(act==='open-settings'){ settingsJoinInput=false; settingsRoomCodeDraft=''; pushScreen({type:'settings'}); }
  else if(act==='set-device-role'){
    state.deviceRole = value; saveState();
    if(value==='child' && !state.boundChildId){ screenStack=[]; step='pickYourself'; }
    render();
  }
  else if(act==='create-room'){ connectCloudSync(genRoomCode(), true); }
  else if(act==='open-settings-join'){ settingsJoinInput=true; settingsRoomCodeDraft=''; render(); }
  else if(act==='cancel-settings-join'){ settingsJoinInput=false; render(); }
  else if(act==='do-settings-join'){
    var code = (settingsRoomCodeDraft||'').trim().toUpperCase();
    if(code.length!==8){ toast(t('invalidRoomCodeToast')); return; }
    settingsJoinInput=false;
    connectCloudSync(code, false);
  }
  else if(act==='disconnect-room'){ disconnectCloudSync(); }
  else if(act==='copy-room-code'){ copyRoomCode(); }

  else if(!isParentMode() && ['open-add-parent','open-add-child','ask-delete-child','open-manage-behaviors','open-manage-thresholds','open-add-behavior-form','edit-behavior','save-behavior','confirm-delete-behavior','open-add-threshold-form','save-threshold','delete-threshold'].indexOf(act)>=0){
    return; // 孩子模式下这些管理类操作一律忽略（入口本来也是隐藏的，这里是双保险）
  }

  else if(act==='open-add-parent'){ screenForm = {name:'', avatar:'cloud'}; pushScreen({type:'addParent'}); }
  else if(act==='open-add-child'){ screenForm = {name:'',gender:'保密',age:'',height:'',weight:'',avatar:'star'}; pushScreen({type:'addChild'}); }
  else if(act==='open-child'){ editChildTab='info'; confirmDeleteChild=false; pushScreen({type:'editChild', childId:id}); }

  else if(act==='modal-add-parent-avatar'){ screenForm.avatar = value; render(); }
  else if(act==='save-add-parent'){ saveAddParent(); }

  else if(act==='modal-add-child-gender'){ screenForm.gender = value; render(); }
  else if(act==='modal-add-child-avatar'){ screenForm.avatar = value; render(); }
  else if(act==='save-add-child'){ saveAddChild(); }

  else if(act==='edit-child-tab'){ editChildTab = value; confirmDeleteChild=false; showCustomFoodForm=false; showCustomExerciseForm=false; showCalorieOverrideForm=false; showNutritionSettings=false; selectedExerciseRefId=null; selectedFoodRefId=null; selectedRangeBehaviorId=null; mealFoodSearch=''; mealFoodShowAll=false; exerciseSearch=''; exerciseShowAll=false; showRewardForm=false; showPenaltyForm=false; showExchangeRateForm=false; showSpecialOfferForm=false; showManualLedgerForm=false; showTransferForm=false; showLedgerAdjustForm=false; showPointsAdjustForm=false; render(); }
  else if(act==='edit-child-avatar'){ var c = data.children.find(function(x){return x.id===id;}); if(c){ c.avatar=value; persistEntity('children', c);} render(); }
  else if(act==='edit-child-gender'){ var c = data.children.find(function(x){return x.id===id;}); if(c){ c.gender=value; persistEntity('children', c);} render(); }
  else if(act==='save-edit-child-info'){ saveEditChildInfo(id); }
  else if(act==='ask-delete-child'){ confirmDeleteChild = true; render(); }
  else if(act==='cancel-delete-child'){ confirmDeleteChild = false; render(); }
  else if(act==='confirm-delete-child'){ persistDelete('children', id); popScreen(); toast(t('deletedProfileToast')); }
  else if(act==='add-height'){ addGrowthRecord(id, 'height'); }
  else if(act==='add-weight'){ addGrowthRecord(id, 'weight'); }

  else if(act==='log-point'){
    var loggedEntry = addPointLog(id, value);
    toast(loggedEntry ? ((loggedEntry.points>=0?'+':'')+fmtPts(loggedEntry.points)+' '+t('pointsRecordedToast')) : '');
    render();
  }
  else if(act==='pick-range-behavior'){ selectedRangeBehaviorId = (selectedRangeBehaviorId===value) ? null : value; render(); }
  else if(act==='log-range-point'){
    var chosenPts = parseFloat(el.getAttribute('data-points'));
    var loggedEntry2 = addPointLog(id, value, chosenPts);
    selectedRangeBehaviorId = null;
    toast(loggedEntry2 ? ((loggedEntry2.points>=0?'+':'')+fmtPts(loggedEntry2.points)+' '+t('pointsRecordedToast')) : '');
    render();
  }
  else if(act==='toggle-checklist'){ toggleChecklist(id, value); render(); }
  else if(act==='delete-log'){ deletePointLog(id); render(); }
  else if(act==='open-child-points'){ editChildTab='points'; confirmDeleteChild=false; pushScreen({type:'editChild', childId:id}); }

  else if(act==='cal-prev'){ shiftCalMonth(getCalState(id), -1); render(); }
  else if(act==='cal-next'){ shiftCalMonth(getCalState(id), 1); render(); }
  else if(act==='cal-select-day'){ getCalState(id).sel = value; render(); }

  else if(act==='open-child-health'){ editChildTab='health'; confirmDeleteChild=false; healthSubTab='meals'; showCustomFoodForm=false; showCustomExerciseForm=false; showCalorieOverrideForm=false; selectedExerciseRefId=null; pushScreen({type:'editChild', childId:id}); }
  else if(act==='health-sub-tab'){ healthSubTab = value; showCustomFoodForm=false; showCustomExerciseForm=false; selectedExerciseRefId=null; selectedFoodRefId=null; mealFoodSearch=''; mealFoodShowAll=false; exerciseSearch=''; exerciseShowAll=false; render(); }

  else if(act==='open-child-redeem'){ editChildTab='redeem'; confirmDeleteChild=false; redeemSubTab='rewards'; showRewardForm=false; showPenaltyForm=false; pushScreen({type:'editChild', childId:id}); }
  else if(act==='redeem-sub-tab'){ redeemSubTab = value; showRewardForm=false; showPenaltyForm=false; render(); }
  else if(act==='open-reward-form'){ showRewardForm=true; rewardFormScope='total'; render(); }
  else if(act==='cancel-reward-form'){ showRewardForm=false; render(); }
  else if(act==='draft-reward-scope'){ rewardFormScope = value; render(); }
  else if(act==='save-reward'){
    var name = document.getElementById('mRewardName').value.trim();
    var cost = parseFloat(document.getElementById('mRewardCost').value);
    if(!name || !cost){ toast(t('fillRewardFieldsToast')); return; }
    var behaviorId = null;
    if(rewardFormScope==='behavior'){
      var sel = document.getElementById('mRewardBehaviorSelect');
      behaviorId = sel ? sel.value : null;
      if(!behaviorId){ toast(t('selectBehaviorFirstToast')); return; }
    }
    addReward(id, name, '', rewardFormScope, behaviorId, cost);
    showRewardForm = false;
    render();
  }
  else if(act==='delete-reward'){ deleteReward(id, value); render(); }
  else if(act==='redeem-reward'){ redeemReward(id, value); toast(t('redeemedRewardToast')); render(); }

  else if(act==='open-penalty-form'){ showPenaltyForm=true; penaltyFormScope='total'; render(); }
  else if(act==='cancel-penalty-form'){ showPenaltyForm=false; render(); }
  else if(act==='draft-penalty-scope'){ penaltyFormScope = value; render(); }
  else if(act==='save-penalty'){
    var name2 = document.getElementById('mPenaltyName').value.trim();
    var offset = parseFloat(document.getElementById('mPenaltyOffset').value);
    if(!name2 || !offset){ toast(t('fillPenaltyFieldsToast')); return; }
    var behaviorId2 = null;
    if(penaltyFormScope==='behavior'){
      var sel2 = document.getElementById('mPenaltyBehaviorSelect');
      behaviorId2 = sel2 ? sel2.value : null;
      if(!behaviorId2){ toast(t('selectBehaviorFirstToast')); return; }
    }
    addPenalty(id, name2, '', penaltyFormScope, behaviorId2, offset);
    showPenaltyForm = false;
    render();
  }
  else if(act==='delete-penalty'){ deletePenalty(id, value); render(); }
  else if(act==='execute-penalty'){ executePenalty(id, value); toast(t('penaltyExecutedToast')); render(); }

  else if(act==='open-child-ledger'){ editChildTab='ledger'; confirmDeleteChild=false; ledgerCurrency='CAD'; showExchangeRateForm=false; showSpecialOfferForm=false; showManualLedgerForm=false; showTransferForm=false; showLedgerAdjustForm=false; pushScreen({type:'editChild', childId:id}); }
  else if(act==='set-ledger-currency'){ ledgerCurrency = value; showExchangeRateForm=false; showSpecialOfferForm=false; showManualLedgerForm=false; showTransferForm=false; showLedgerAdjustForm=false; render(); }
  else if(act==='open-rate-form'){ showExchangeRateForm=true; render(); }
  else if(act==='cancel-rate-form'){ showExchangeRateForm=false; render(); }
  else if(act==='save-rate'){
    var pts = parseFloat(document.getElementById('mRatePoints').value);
    var money = parseFloat(document.getElementById('mRateMoney').value);
    if(!pts || !money){ toast(t('fillRateFieldsToast')); return; }
    saveExchangeRate(id, ledgerCurrency, pts, money);
    showExchangeRateForm = false;
    render();
  }
  else if(act==='open-offer-form'){ showSpecialOfferForm=true; render(); }
  else if(act==='cancel-offer-form'){ showSpecialOfferForm=false; render(); }

    var oname = document.getElementById('mOfferName').value.trim();
    var ostart = document.getElementById('mOfferStart').value;
    var oend = document.getElementById('mOfferEnd').value;
    var opts = parseFloat(document.getElementById('mOfferPoints').value);
    var omoney = parseFloat(document.getElementById('mOfferMoney').value);
    if(!oname || !ostart || !oend || !opts || !omoney){ toast(t('fillOfferFieldsToast')); return; }
    addSpecialOffer(id, ledgerCurrency, oname, ostart, oend, opts, omoney);
    showSpecialOfferForm = false;
    render();
  }
  else if(act==='delete-offer'){ deleteSpecialOffer(id, value); render(); }
  else if(act==='draft-ledger-direction'){ manualLedgerDirection = value; render(); }
  else if(act==='draft-ledger-category'){ manualLedgerCategory = value; render(); }
  else if(act==='open-ledger-form'){ showManualLedgerForm=true; manualLedgerDirection='income'; manualLedgerCategory='grant'; render(); }
  else if(act==='cancel-ledger-form'){ showManualLedgerForm=false; render(); }

    var source = document.getElementById('mLedgerSource').value.trim();
    var amt = parseFloat(document.getElementById('mLedgerAmount').value);
    if(!source || !amt){ toast(t('fillLedgerFieldsToast')); return; }
    var signedAmt = manualLedgerDirection==='expense' ? -Math.abs(amt) : Math.abs(amt);
    addLedgerEntry(id, source, signedAmt, manualLedgerCategory, null, ledgerCurrency);
    showManualLedgerForm = false;
    render();
  }
  else if(act==='delete-ledger-entry'){ deleteLedgerEntry(id); render(); }
  else if(act==='confirm-exchange'){
    var ptsToSpend = parseFloat(document.getElementById('mExchangePoints').value);
    if(!ptsToSpend || ptsToSpend<=0){ return; }
    if(pointBalance(id) < ptsToSpend){ toast(t('notEnoughPointsToast')); return; }
    exchangePointsForMoney(id, ledgerCurrency, ptsToSpend);
    toast(t('exchangeSuccessToast'));
    render();
  }
  else if(act==='open-transfer-form'){ showTransferForm=true; transferToCurrencyDraft = CURRENCIES.filter(function(cur){return cur.code!==ledgerCurrency;})[0].code; render(); }

    var toAmt = Math.round(fromAmt * rateVal * 100) / 100;
